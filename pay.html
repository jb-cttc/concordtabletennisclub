<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pay for Tonight - Concord Table Tennis Club</title>
  <meta name="description" content="Pay tonight's Concord Table Tennis Club fee ahead by card, with Venmo or Zelle, or sign up for the members' monthly pass.">
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Concord Table Tennis Club">
  <meta property="og:title" content="Pay for Tonight - Concord Table Tennis Club">
  <meta property="og:description" content="Venmo or Zelle: pick one and pay tonight's fee.">
  <meta property="og:image" content="https://concordtabletennisclub.com/assets/logo.png">
  <link rel="stylesheet" href="style.css?v=2026112202">
  <!-- The page the QR code at the front desk opens; that code's link also carries the key to Venmo and Zelle (pay.js).
       No site header and not in the menu: the home page offers the same options under Fees. scripts/sync-nav.js leaves
       this page alone. -->
  <link rel="icon" href="assets/logo.png" type="image/png">
  <meta name="theme-color" content="#FAF8F3">
</head>
<body>

<!-- Arriving from the desk QR code: the logo and a QR code for this page (assets/pay-qr.svg, without the desk key), then
     they shrink away to the options. Pure CSS, so it ends on
     time even if the script never runs; a tap skips it, and it is left out for anyone who asks for reduced motion. -->
<div class="pay-intro" aria-hidden="true">
  <div class="pay-intro-mark">
    <img class="pay-intro-logo" src="assets/logo-transparent.png" alt="">
    <img class="pay-intro-qr" src="assets/pay-qr.svg" alt="">
  </div>
</div>

<main class="pay">
  <a class="pay-logo" href="index.html"><img src="assets/logo-transparent.png" alt="Concord Table Tennis Club"></a>
  <h1>Pay for tonight</h1>
  <div class="pay-widget" data-pay></div>
  <p class="pay-links"><a href="membership.html">Membership</a> <span aria-hidden="true">&middot;</span> <a href="index.html">CTTC website</a></p>
</main>

<script>
  document.querySelector(".pay-intro").addEventListener("click", function () { document.body.classList.add("pay-skip"); });
</script>
<script src="turnout.js"></script>
<script src="pay.js?v=2026112202"></script>

</body>
</html>
