<!doctype html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 16px; font: 16px/1.5 Arial, sans-serif; color: #1c1c1c; background: #fff; }
  h1 { margin: 0 0 6px; font-size: 1.25rem; }
  h2 { margin: 22px 0 8px; font-size: 1.05rem; }
  p { margin: 0 0 12px; color: #555; font-size: 0.95rem; }
  .tabs { display: flex; gap: 8px; margin: 12px 0 16px; }
  .tabs button { background: #fff; color: #1f6b3a; }
  .tabs button.on { background: #1f6b3a; color: #fff; }
  label { display: block; margin: 10px 0 4px; font-size: 0.9rem; font-weight: 600; }
  input[type=text], input[type=email], input[type=tel], input[type=date], select, textarea { box-sizing: border-box; width: 100%; padding: 9px 10px; border: 1px solid #c9c4b8; border-radius: 4px; font: inherit; }
  textarea { min-height: 70px; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
  .check input { width: auto; }
  button { padding: 9px 16px; border: 1px solid #1f6b3a; border-radius: 4px; background: #1f6b3a; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.plain { background: #fff; color: #1f6b3a; }
  button.danger { background: #fff; color: #8b1a1a; border-color: #8b1a1a; }
  button:disabled { opacity: 0.6; cursor: default; }
  button.registered { border-width: 2px; color: #13853a; }
  button .left { font-weight: 400; color: #6b675e; }
  .setup { list-style: none; margin: 6px 0 0; padding: 0; }
  .setup li { display: flex; gap: 8px; margin: 6px 0; }
  .setup .mark { flex: 0 0 1.2em; font-weight: 700; text-align: center; }
  .setup .done .mark { color: #13853a; }
  .setup .todo .mark { color: #8b1a1a; }
  .setup .fix { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .setup .fix a.button { display: inline-block; padding: 7px 14px; border: 1px solid #1f6b3a; border-radius: 4px; background: #1f6b3a; color: #fff; font-weight: 600; text-decoration: none; }
  .setup .fix button, .setup .fix a.button { font-size: 0.95em; }
  .setup .hint { margin: 6px 0 0; font-size: 0.95em; color: #4a463f; }
  .setup .sent { margin: 6px 0 0; font-size: 0.95em; color: #13853a; font-weight: 600; }
  .setup .sent.error { color: #8b1a1a; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .row > * { flex: 1 1 140px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .day { margin: 14px 0 6px; font-weight: 700; }
  .slots { display: flex; flex-wrap: wrap; gap: 10px; }
  .cal { display: grid; gap: 8px; margin: 6px 0 14px; }
  .crow { display: flex; align-items: center; gap: 10px; }
  .ctime { flex: 0 0 74px; font-size: 0.85rem; color: #555; }
  .tbl { position: relative; box-sizing: border-box; flex: 1 1 0; min-width: 0; max-width: 190px; min-height: 48px; padding: 6px 8px; border: 2px solid #1f4f8f; border-radius: 8px; background: #2a6fb8; color: #fff; font: 600 0.8rem/1.25 Arial, sans-serif; text-align: center; display: flex; align-items: center; justify-content: center; }
  .tbl::after { content: ''; position: absolute; top: 5px; bottom: 5px; left: 50%; width: 2px; margin-left: -1px; background: rgba(255, 255, 255, 0.6); }
  .tbl span { position: relative; z-index: 1; padding: 0 5px; border-radius: 3px; background: inherit; }
  .slots .tbl { flex: 0 1 190px; }
  button.tbl { cursor: pointer; }
  button.tbl.free { background: #fff; border: 2px dashed #7aa886; color: #1f6b3a; }
  button.tbl.free::after, .tbl.empty::after { background: #cfe3d5; }
  button.tbl.free.reach { background: #e3f1e7; border-style: solid; border-color: #1f6b3a; }
  button.tbl.free.nofit { background: #fbeeee; border-color: #c99; color: #8b1a1a; cursor: not-allowed; }
  button.tbl.mine { background: #1f6b3a; border-color: #164f2a; color: #fff; }
  button.tbl.draft { background: #fff; border: 2px dashed #1f6b3a; color: #1f6b3a; }
  button.tbl.draft::after { background: #cfe3d5; }
  button.tbl.held { background: #c98a00; border-color: #9a6a00; color: #fff; cursor: default; }
  .tbl.held { background: #c98a00; border-color: #9a6a00; color: #fff; }
  button.tbl.removing { background: #fff; border: 2px dashed #8b1a1a; color: #8b1a1a; text-decoration: line-through; }
  button.tbl.removing::after { background: #f0d6d6; }
  .tbl.taken { background: #8a8a8a; border-color: #6f6f6f; color: #fff; }
  .tbl .step { display: block; margin-top: 2px; font-size: 0.78rem; font-style: italic; }
  .tbl .step.change { margin: 4px auto 2px; padding: 2px 6px; border-radius: 4px; background: #fde2e1; color: #7a1f17; font-style: normal; font-weight: 700; }
  .tbl.empty { background: #fff; border: 2px dashed #ddd; color: #aaa; font-weight: 400; }
  .tbl:disabled { opacity: 1; }
  .legend { font-size: 0.85rem; color: #555; margin: 4px 0 8px; }
  .lengths { display: flex; gap: 8px; margin: 4px 0 8px; }
  .grid { display: grid; gap: 6px; margin: 6px 0 14px; max-width: 520px; }
  .grid .tbl { max-width: none; flex-direction: column; gap: 3px; }
  .grid .tbl b { position: relative; z-index: 1; padding: 0 5px; border-radius: 3px; background: inherit; }
  .thead { text-align: center; font-size: 0.85rem; font-weight: 700; color: #555; }
  .thead button { margin-top: 4px; padding: 3px 8px; font-size: 0.75rem; }
  .gtime { font-size: 0.8rem; color: #555; padding-top: 4px; }
  .tbl.other { background: #fff; border: 2px dashed #ccc; color: #888; font-weight: 400; }
  .tbl.other::after { background: #eee; }
  button.mini { position: relative; z-index: 1; padding: 3px 8px; font-size: 0.75rem; background: #fff; color: #1f4f8f; border-color: #fff; }
  .board { margin: 0; padding: 0; list-style: none; }
  .board li { padding: 6px 0; border-top: 1px solid #eee; font-size: 0.95rem; }
  .board li span { color: #555; }
  .card { border: 1px solid #ddd8cc; border-radius: 6px; padding: 10px 12px; margin: 8px 0; }
  .card b { display: block; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; background: #eee; font-size: 0.8rem; }
  .tag.pending, .tag.proposed { background: #fff3c4; }
  .tag.confirmed { background: #d9f0e0; }
  #message { margin: 12px 0; min-height: 1.4em; font-size: 0.95rem; }
  /* An error stays at the top of the screen while scrolling, e.g. after tapping a time far down the coach grid. */
  #message.error { color: #8b1a1a; position: sticky; top: 0; z-index: 5; background: #fff3f3; padding: 6px 8px; border-left: 4px solid #8b1a1a; }
  #message.ok { color: #1f6b3a; font-weight: 600; }
  /* The guardian field slides down into view when "under 18" is ticked, and back up when it is unticked. */
  @keyframes slide-open { from { opacity: 0; max-height: 0; transform: translateY(-10px); } to { opacity: 1; max-height: 140px; transform: none; } }
  @keyframes slide-shut { from { opacity: 1; max-height: 140px; transform: none; } to { opacity: 0; max-height: 0; transform: translateY(-10px); } }
  /* Same height during and after the slide (the label's margins stay inside the box), so it ends without a jump. */
  #guardianBox:not([hidden]) { display: flow-root; }
  .slide-open { animation: slide-open 260ms ease-out; overflow: hidden; }
  .slide-shut { animation: slide-shut 200ms ease-in forwards; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { .slide-open, .slide-shut { animation: none; } }
  .form-status { margin: 8px 0 0; font-size: 0.95rem; }
  .form-status:empty { display: none; }
  .form-status.error { color: #8b1a1a; font-weight: 600; }
  .form-status.ok { color: #1f6b3a; font-weight: 600; }
  .field-error { margin: 4px 0 8px; color: #8b1a1a; font-size: 0.9rem; font-weight: 600; }
  input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: #8b1a1a; box-shadow: 0 0 0 2px #f3c7c7; }
  .trap { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  [hidden] { display: none !important; }
  /* The last check before a lesson request is sent: what goes to the coach, and where we will email the student. */
  dialog { box-sizing: border-box; width: calc(100% - 32px); max-width: 460px; padding: 18px 18px 16px; border: 0; border-radius: 8px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); color: #1c1c1c; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  dialog h2 { margin-top: 0; }
  dialog p { color: #1c1c1c; }
  .sendlist { margin: 0 0 12px; padding: 0; list-style: none; border: 1px solid #ddd8cc; border-radius: 6px; }
  .sendlist li { padding: 6px 10px; border-top: 1px solid #eee; font-size: 0.95rem; overflow-wrap: anywhere; }
  .sendlist li:first-child { border-top: 0; }
  .sendlist b { display: inline-block; min-width: 86px; color: #555; font-weight: 600; }
  /* The address we will write to, large enough to read letter by letter, and editable right in the confirm step. */
  .emailcheck { margin: 4px 0 14px; padding: 12px 14px; border: 2px solid #1f6b3a; border-radius: 8px; background: #f2f8f4; }
  .emailcheck.warn { border-color: #c98a00; background: #fffaf0; }
  .emailcheck .lead { display: block; margin: 0 0 2px; color: #1c1c1c; font-size: 0.9rem; font-weight: 600; }
  button.addrbtn { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; padding: 0; border: 0; background: none; color: #111; text-align: left; font-weight: 700; }
  button.addrbtn .addr { flex: 1 1 auto; min-width: 0; font-size: 1.3rem; line-height: 1.3; overflow-wrap: anywhere; }
  button.addrbtn .nobr { white-space: nowrap; }
  button.addrbtn .dom { text-decoration: underline; text-decoration-color: #c98a00; text-decoration-thickness: 3px; text-underline-offset: 3px; }
  button.addrbtn .pen { flex: 0 0 auto; padding: 5px 10px; border: 1px solid #1f6b3a; border-radius: 4px; background: #fff; color: #1f6b3a; font-size: 0.85rem; font-weight: 600; }
  .emailcheck label { margin-top: 0; }
  .emailcheck input[type=email] { font-size: 1.15rem; font-weight: 700; }
  .emailcheck .fixed { margin: 6px 0 0; color: #1f6b3a; font-size: 0.88rem; font-weight: 600; }
  /* A likely typo in an email address: amber for a clear slip, a quieter blue for one worth a look. */
  .typo { margin: 8px 0 4px; padding: 8px 10px; border: 1px solid #e0b84a; border-radius: 6px; background: #fff5dc; color: #1c1c1c; font-size: 0.92rem; }
  .typo.soft { border-color: #b7c7d9; background: #eef3f8; }
  .typo.done { border-color: #9cc7a9; background: #f2f8f4; color: #1f6b3a; font-weight: 600; }
  .typo b { overflow-wrap: anywhere; }
  .typo .actions { margin-top: 6px; }
  .typo button { padding: 6px 12px; font-size: 0.9rem; }
  input.typo-clear { border-color: #c98a00; box-shadow: 0 0 0 2px #f6e3b0; }
  /* Lesson rates: a coach's own price for 50 and 25 minutes, shown on the board, under the picked time and in the confirm box. */
  .tbl .rate { font-size: 0.78rem; font-weight: 700; }
  .rates { margin: 4px 0 0; padding: 0; list-style: none; }
  .rates li { padding: 3px 0; font-size: 0.95rem; }
  .rateline { margin: 0 0 12px; padding: 8px 12px; border-left: 4px solid #1f6b3a; border-radius: 4px; background: #f2f8f4; color: #1c1c1c; font-size: 0.98rem; }
  .rateline.none { border-left-color: #c9c4b8; background: #f6f5f1; color: #555; }
  .money { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .money .field-error { flex: 1 0 100%; margin: 0; }
  #coachRates h2 { margin-top: 4px; }
  .money span { font-weight: 700; color: #555; }
  .money input[type=text] { max-width: 120px; }
  input.typo-soft { border-color: #7d98b8; box-shadow: 0 0 0 2px #dbe5f0; }
</style>
</head>
<body>
<h1>Coaching lessons</h1>
<div id="message" role="status" aria-live="polite"></div>
<div id="app"></div>
<script>
  var INITIAL = null;
  var app = document.getElementById('app');
  var messageBox = document.getElementById('message');
  // Details a visitor chose to remember on this device. Storage can be blocked in a framed page, so it is optional.
  function saved(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (error) { return null; } }
  function remember(key, value) { try { if (value) localStorage.setItem(key, JSON.stringify(value)); else localStorage.removeItem(key); } catch (error) {} }

  function show(text, kind) { messageBox.textContent = text || ''; messageBox.className = kind || ''; }
  // A form's own status line, right under its buttons, so the answer to pressing Send is seen where the person is looking (on a
  // phone the page-top message can be thousands of pixels away). fields maps a server field name to an input in this form; the
  // input at fault is outlined and focused. Once the form has closed (after a success), the page-top message says it instead.
  function report(form, text, kind, field, fields) {
    show(form.hidden ? text : '', form.hidden ? kind : '');
    var line = form.querySelector('.form-status');
    if (!line) {
      line = el('p', { 'class': 'form-status', role: 'status', 'aria-live': 'polite' });
      var buttons = form.querySelectorAll('.actions');
      var last = buttons[buttons.length - 1];
      if (last) last.parentNode.insertBefore(line, last.nextSibling);
      else form.appendChild(line);
    }
    line.textContent = text || '';
    line.className = 'form-status' + (kind ? ' ' + kind : '');
    line.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    unmark(form);
    var input = field && fields && fields[field] ? form.querySelector(fields[field]) : null;
    if (input) {
      // The same words right under the field, so the field and the reason are seen together on a small screen.
      var note = el('p', { 'class': 'field-error', id: input.id + 'Error', text: text });
      input.parentNode.insertBefore(note, input.nextSibling);
      input.setAttribute('aria-invalid', 'true');
      input.setAttribute('aria-describedby', note.id);
      input.focus({ preventScroll: true });
    }
    // The field to fix, if any (the error line is just under the Send button nearby), else the answer itself.
    if (kind === 'error' || kind === 'ok') (form.hidden ? messageBox : input || line).scrollIntoView({ block: 'center' });
  }
  // A form reopened for another time starts with no old answer or outline.
  function resetStatus(form) {
    var line = form.querySelector('.form-status');
    if (line) {
      line.textContent = '';
      line.className = 'form-status';
    }
    unmark(form);
  }
  function unmark(root) {
    Array.prototype.forEach.call(root.querySelectorAll('[aria-invalid="true"]'), unmarkInput);
  }
  function unmarkInput(input) {
    input.removeAttribute('aria-invalid');
    input.removeAttribute('aria-describedby');
    var note = document.getElementById(input.id + 'Error');
    if (note) note.parentNode.removeChild(note);
  }
  function clearInvalid(event) { if (event.target.getAttribute('aria-invalid')) unmarkInput(event.target); }
  function el(tag, attributes, children) {
    var node = document.createElement(tag);
    Object.keys(attributes || {}).forEach(function (key) {
      if (key === 'text') node.textContent = attributes[key];
      else if (key === 'onclick') node.addEventListener('click', attributes[key]);
      else node.setAttribute(key, attributes[key]);
    });
    (children || []).forEach(function (child) { if (child) node.appendChild(child); });
    return node;
  }
  function field(label, input) { return [el('label', { text: label, 'for': input.id }), input]; }
  function clear() { while (app.firstChild) app.removeChild(app.firstChild); }
  // Served by Google, the page calls the app with google.script.run. The club site's copy (coaching-app.html) has no
  // google.script and calls the app's address instead.
  var API_URL = 'https://script.google.com/macros/s/AKfycbywI5OV0aaitPbzchxfyJUK4Q6_uLbFpF39O_cq8fLikbSO5Sy_NW3B3R-NlPtTS2YdTw/exec';
  var ON_SITE = !(window.google && window.google.script && window.google.script.run);
  // Until the app has answered once, a failed call hands over to Google's own page: that is how the page opened before the
  // site had its copy, and it keeps the button working while the site is a release ahead of the app.
  var reached = false;
  function call(name, args, done) {
    if (ON_SITE) {
      // No cookies: the visitor's Google sign-ins never reach Google, so they can never get in the way.
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: name, args: args }), credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
        .then(function (response) { return response.json(); })
        .then(function (result) { reached = true; done(result || { ok: false, message: 'Something went wrong. Please try again.' }); },
          function () {
            if (!reached) { window.location.replace(API_URL); return; }
            done({ ok: false, message: 'Something went wrong. Please check your connection and try again.' });
          });
      return;
    }
    var runner = google.script.run
      .withSuccessHandler(function (result) { done(result || { ok: false, message: 'Something went wrong. Please try again.' }); })
      .withFailureHandler(function () { done({ ok: false, message: 'Something went wrong. Please try again.' }); });
    runner[name].apply(runner, args);
  }
  function guarded(button, name, args, done) {
    button.disabled = true;
    call(name, args, function (result) { button.disabled = false; if (result.ok) preloaded = {}; done(result); });
  }
  // Data fetched ahead of time so the next view opens at once. Each copy is used once, and dropped after any change.
  var preloaded = {};
  function preload(name, args) {
    var key = name + JSON.stringify(args);
    if (preloaded[key]) return;
    var entry = preloaded[key] = { at: Date.now(), waiting: [] };
    call(name, args, function (result) {
      entry.result = result;
      entry.waiting.forEach(function (done) { done(result); });
      entry.waiting = [];
    });
  }
  function load(name, args, done) {
    var key = name + JSON.stringify(args);
    var entry = preloaded[key];
    delete preloaded[key];
    if (!entry || Date.now() - entry.at > 60000) { call(name, args, done); return; }
    if (entry.result) done(entry.result);
    else entry.waiting.push(done);
  }

  // ----- Students: pick a time and ask -----
  function bookingView() {
    clear(); show('');
    app.appendChild(el('p', { text: 'Coaching is on Fridays 7 to 10 PM and Saturdays 3 to 6 PM (Pacific Time). Choose a 25 or 50 minute lesson, then pick an open table: any time that has not started yet can be requested. Each lesson ends 5 or 10 minutes before the next so everyone can pack up. No account is needed: your request goes straight to the coach, and the lesson is booked once the coach accepts. We email you either way. To cancel a lesson or a request, tap your time and choose Cancel: it is cancelled right there, and our email about it lets you undo a mistake. To move a lesson, tap your time, pick the new one and reply YES to the email we send. Coaches and students appear by first name only (Coach Dominic, Student Sam). Your coach gets your name, email and mobile number (if given) with your request; you get your coach\'s once the lesson is confirmed.' }));
    var list = el('div', { id: 'slots' }, [el('p', { text: 'Loading open times...' })]);
    app.appendChild(list);
    load('openSlots', [], function (result) {
      preload('coachList', []);
      clear2(list);
      if (!result.ok) { list.appendChild(el('p', { text: result.message })); return; }
      var openOf = function (minutes) { return boardFor(result, minutes).some(function (entry) { return entry.status === 'open' && fits(entry, minutes); }); };
      var length = openOf(50) || !openOf(25) ? 50 : 25;
      var chosen = null;
      var moving = null;
      var form = requestForm(function () { return chosen; }, function () { return length; }, function (coachId, rates) {
        // The coach changed a rate since the page loaded: show the new one before anything is sent.
        result.rates = result.rates || {};
        if (rates && (rates[50] || rates[25])) result.rates[coachId] = rates;
        else delete result.rates[coachId];
        drawRates();
        if (chosen && chosen.coachId === coachId) { chosen.rate = rateOf(result, chosen); describe(chosen); }
      });
      var rateBox = el('div');
      function drawRates() {
        clear2(rateBox);
        var card = ratesCard(result);
        if (card) rateBox.appendChild(card);
      }
      // What the student is asking for, under the form's heading, with the coach's rate for it (or that none is listed).
      function describe(entry) {
        form.querySelector('#picked').textContent = 'Requesting a ' + entry.minutes + ' minute lesson on ' + entry.day + ', ' + entry.time + ' with ' + entry.coach + ' at Table ' + entry.table + '.' +
          (entry.whole ? ' The other half of that hour stays open for someone else.' : '');
        var line = form.querySelector('#pickedRate');
        line.textContent = rateText(entry);
        line.className = entry.rate ? 'rateline' : 'rateline none';
      }
      var waitForm = waitlistForm();
      var changeForm = changeLessonForm(function (entry) {
        moving = entry;
        form.hidden = true;
        waitForm.hidden = true;
        show('Now tap the open time you want instead. Use the length buttons to see the other lesson length.', 'ok');
        grids.scrollIntoView({ block: 'start' });
      });
      var picker = el('div', { 'class': 'lengths', role: 'group', 'aria-label': 'Lesson length' });
      var grids = el('div');
      [25, 50].forEach(function (minutes) {
        var button = el('button', { type: 'button', text: minutes + ' minutes', 'data-minutes': String(minutes) });
        button.addEventListener('click', function () {
          length = minutes; chosen = null; form.hidden = true; waitForm.hidden = true; if (!moving) show(''); draw();
        });
        picker.appendChild(button);
      });
      function draw() {
        Array.prototype.forEach.call(picker.children, function (button) {
          var on = Number(button.getAttribute('data-minutes')) === length;
          button.className = on ? '' : 'plain';
          button.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        clear2(grids);
        var open = boardFor(result, length).filter(function (entry) { return entry.status === 'open' && fits(entry, length); });
        if (!open.length) grids.appendChild(el('p', { text: 'No ' + length + ' minute lessons are open right now. Try the other length, join a waitlist below, or check back soon.' }));
        result.days.forEach(function (day) {
          grids.appendChild(el('div', { 'class': 'day', text: day.day }));
          grids.appendChild(dayGrid(day, result, length, pick, watch, change));
        });
      }
      function pick(entry, button) {
        if (moving) {
          // A move keeps the length the coach offered.
          changeForm.open(moving, withRate(result, entry.whole || entry));
          moving = null;
          return;
        }
        chosen = withRate(result, entry);
        changeForm.hidden = true;
        Array.prototype.forEach.call(grids.querySelectorAll('button.tbl.mine'), function (other) { other.className = 'tbl free'; });
        button.className = 'tbl mine';
        waitForm.hidden = true;
        resetStatus(form);
        form.hidden = false;

    // Done sits under the hint, so a suggestion appears right under the address it is about.

    var confirmHint = el('div', { id: 'confirmHint', 'class': 'typo', hidden: 'hidden', role: 'status' });
    var lead = el('span', { 'class': 'lead', id: 'confirmLead', text: 'We will email the coach’s answer to:' });

    var dialog = el('dialog', { id: 'confirmRequest', 'aria-labelledby': 'confirmTitle', 'aria-describedby': 'confirmWhat confirmLead confirmAddr confirmHint' }, [

    document.body.appendChild(dialog);

    function looksLikeEmail(value) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value); }

    editInput.addEventListener('input', function () { markTypo(editInput, null); fillHint(confirmHint, null); emailBox.className = 'emailcheck'; });

  // ----- Coaches: pick yourself, choose times, confirm by email or text -----
  function coachPicker(auto) {
    clear(); show('');
    app.appendChild(el('h2', { text: 'Which CTTC registered coach are you?' }));
    var list = el('div', { 'class': 'actions' }, [el('p', { text: 'Loading...' })]);
    app.appendChild(list);
    app.appendChild(el('p', { text: 'No account is needed. Nothing changes until you reply YES to the email we send to the address the club has for you. If the club also has your mobile number, we text you too and you can answer either one. A green \u2713 means the coach is fully set up: they have answered one of our emails, texted the club number from their mobile, and published both lesson rates. If steps are left, pick your name to see what to do. Privacy: students see you only by first name (such as Coach Dominic) until you accept a lesson. Each lesson request comes with the student\'s name, email and mobile number (if given), so you can reach them before you answer; once you accept, the student gets your name, email and mobile number (if the club has them).' }));
    var last = saved('cttc-coach');
    load('coachList', [], function (result) {
      preload('openSlots', []);
      clear2(list);
      if (!result.ok) { show(result.message, 'error'); return; }
      if (!result.coaches.length) list.appendChild(el('p', { text: 'No coaches are set up yet. Please ask the club.' }));
      result.coaches.forEach(function (coach) {
        // left: the steps of the setup checklist not done yet (an app from before the checklist sends none).
        var steps = coach.ready && !coach.registered && coach.left ? el('span', { 'class': 'left', text: ' \u00b7 ' + coach.left + (coach.left === 1 ? ' step' : ' steps') + ' left' }) : null;
        var button = el('button', { type: 'button', 'class': coach.registered ? 'plain registered' : 'plain' },
          [document.createTextNode((coach.registered ? '\u2713 ' : '') + coach.label + (coach.ready ? '' : ' (not set up yet)')), steps]);
        if (coach.registered) button.title = 'Fully set up';
        if (!coach.ready) button.disabled = true;
        var warm = function () { if (coach.ready) preload('coachBoard', [coach.id]); };
        button.addEventListener('pointerenter', warm);
        button.addEventListener('focus', warm);
        button.addEventListener('touchstart', warm, { passive: true });
        button.addEventListener('click', function () { remember('cttc-coach', coach.id); coachBoard(coach.id); });
        list.appendChild(button);
        if (auto && coach.ready && coach.id === last) coachBoard(coach.id);
      });
    });
  }

  // The setup checklist behind the green check (Code.js setupSteps_): each step done, or what the coach does to finish it, with
  // a button for each: a test email to reply YES to, a text to the club number started on the phone (the app cannot text a
  // coach first: Google Voice only replies), and the rate boxes further down the page.
  function setupCard(data) {
    var steps = data.steps;
    var item = function (done, text, fix) {
      return el('li', { 'class': done ? 'done' : 'todo' }, [el('span', { 'class': 'mark', text: done ? '✓' : '✗' }),
        el('div', {}, [el('span', { text: text })].concat(done ? [] : fix || []))]);
    };
    var email = { done: 'Email: you have answered one of our emails from the address the club has for you.',
      untested: 'Email: not confirmed yet. Reply YES to any email we send you, or send yourself a test email now:',
      missing: 'Email: the club has no email address for you. Please ask the club to add it.' }[steps.email];
    var emailFix = [];
    if (steps.email === 'untested') {
      var said = el('p', { 'class': 'sent', role: 'status' });
      var send = el('button', { type: 'button', 'class': 'plain', text: 'Send me a test email' });
      send.addEventListener('click', function () {
        said.className = 'sent';
        said.textContent = 'Sending…';
        guarded(send, 'coachEmailCheck', [data.id], function (result) {
          said.className = result.ok ? 'sent' : 'sent error';
          said.textContent = result.message;
        });
      });
      emailFix = [el('div', { 'class': 'fix' }, [send]), said];
    }
    var digits = String(data.textNumber || '').replace(/\D/g, '');
    var text = { done: 'Mobile: you have texted the club number from the mobile the club has for you.',
      untested: 'Mobile: not confirmed yet. Text the word COACH to ' + data.textNumber + ' from your mobile. We cannot text you first: the club number can only reply.',
      missing: 'Mobile: the club has no mobile number for you. Please ask the club to add it on Coach Admin.' }[steps.text];
    var textFix = steps.text !== 'untested' ? [] : [
      el('div', { 'class': 'fix' }, [el('a', { 'class': 'button', href: 'sms:+1' + digits + '?&body=COACH', target: '_top', text: 'Text COACH now' })]),
      el('p', { 'class': 'hint', text: 'On your phone, the button opens Messages with the number and COACH filled in: just press send. On a computer: open Messages on your mobile, start a new message to ' +
        data.textNumber + ', type COACH and send it. Mobile turns green within a few minutes; refresh this page to see it.' })];
    var rates = steps.rates === 'done' ? 'Rates: your 50 and 25 minute lesson rates are published.' :
      'Rates: enter both your 50 and 25 minute lesson rates and submit. They are published when you reply YES.';
    var goRates = el('button', { type: 'button', 'class': 'plain', text: 'Set my rates' });
    goRates.addEventListener('click', function () {
      var form = document.getElementById('coachRates');
      if (!form) return;
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
      var first = ['rate50', 'rate25'].map(function (id) { return document.getElementById(id); }).filter(function (input) { return input && !input.value.trim(); })[0] ||
        document.getElementById('rate50');
      if (first) first.focus({ preventScroll: true });
    });
    var done = 3 - steps.left;
    return el('div', { 'class': 'card' }, [
      el('strong', { text: steps.left ? 'Your setup: ' + done + ' of 3 done' : '✓ You are fully set up' }),
      el('ul', { 'class': 'setup' }, [item(steps.email === 'done', email, emailFix), item(steps.text === 'done', text, textFix),
        item(steps.rates === 'done', rates, [el('div', { 'class': 'fix' }, [goRates])])])
    ]);
  }

  function coachBoard(coachId, message) {
    clear(); show(message || 'Loading...', message ? 'ok' : '');
    load('coachBoard', [coachId], function (data) {
      preload('openSlots', []);
      if (!message) show('');
      if (!data.ok) { show(data.message, 'error'); return; }
      coachEditor(data);
    });
  }

  function slotKey(slot) { return slot.date + ' ' + slot.start + ' ' + slot.minutes; }

  function coachEditor(data) {
    var length = 60;
    var mine = data.board.filter(function (entry) { return entry.mine; });
    var held = mine.filter(function (entry) { return entry.status === 'requested' || entry.status === 'booked'; });
    var heldKeys = held.map(function (entry) { return entry.date + ' ' + entry.start + ' ' + entry.slot; });
    var baseline = mine.filter(function (entry) { return held.indexOf(entry) < 0; }).map(function (entry) {
      return { date: entry.date, start: entry.start, minutes: entry.slot, table: entry.table };
    });
    var baseKeys = baseline.map(slotKey);
    var wanted = (data.pending || baseline).filter(function (slot) { return heldKeys.indexOf(slotKey(slot)) < 0; }).map(function (slot) {
      return { date: slot.date, start: slot.start, minutes: Number(slot.minutes), table: Number(slot.table) || 1 };
    });
    var others = data.board.filter(function (entry) { return !entry.mine; });

    var back = el('button', { type: 'button', 'class': 'plain', text: 'Not ' + data.name + '?' });
    back.addEventListener('click', function () { remember('cttc-coach', null); coachPicker(); });
    var by = data.email && data.text ? 'email and text' : data.text ? 'text' : 'email';
    app.appendChild(el('p', { text: 'You are ' + data.name + ' (the ' + data.label + ' button). Students and the public schedule see you as ' + data.name + '.' }));
    app.appendChild(el('div', { 'class': 'actions' }, [back]));
    if (data.steps) app.appendChild(setupCard(data));
    if (!data.ready) app.appendChild(el('p', { 'class': 'card', text: data.name + ' is not set up yet. Please ask the club to add your email address or mobile number.' }));
    else if (!data.text) app.appendChild(el('p', { 'class': 'card', text: 'We confirm by email. Want to answer by text instead? Ask the club to add your mobile number, then text COACH to ' + data.textNumber + ' once.' }));
    if (data.pending) {
      app.appendChild(el('p', { 'class': 'card', text: 'We sent you a list by ' + by + ' ' + data.pendingSince + '. Reply YES to publish it, or NO to cancel. That list is shown below; change it and submit again to send a new one.' }));
    }
    // Lesson rates: optional, whole dollars, sent with the times and published by the same YES. A page from before rates sends
    // none, which leaves them as they are.
    var published = data.rates || { 50: '', 25: '' };
    var shownRates = data.pendingRates || published;
    var rateInputs = {};
    var rateFields = { rate50: '#rate50', rate25: '#rate25' };
    var rateNote = el('p', { 'class': 'legend', id: 'rateNote' });
    var rateForm = el('form', { 'class': 'card', id: 'coachRates', novalidate: 'novalidate' }, [
      el('h2', { text: 'Your lesson rates' }),
      el('p', { text: 'Students see your rate when they pick one of your times, in the confirm step and in their emails. Whole dollars, paid directly to you. Both rates are needed for the green \u2713; a box left empty shows no rate.' }),
      el('div', { 'class': 'row' }, [50, 25].map(function (minutes) {
        var input = el('input', { type: 'text', id: 'rate' + minutes, inputmode: 'numeric', maxlength: '7', autocomplete: 'off', placeholder: 'not listed' });
        input.value = shownRates[minutes] || '';
        input.addEventListener('input', function () { draw(); });
        rateInputs[minutes] = input;
        return el('div', {}, [el('label', { text: minutes + ' minute lesson', 'for': input.id }), el('div', { 'class': 'money' }, [el('span', { text: '$', 'aria-hidden': 'true' }), input])]);
      })),
      rateNote]);
    rateForm.addEventListener('input', clearInvalid);
    rateForm.addEventListener('submit', function (event) { event.preventDefault(); });
    app.appendChild(rateForm);
    // '$45', ' 45.00' -> '45'; anything else is left as typed for the check below (and the server's).
    function rateValue(minutes) {
      var text = rateInputs[minutes].value.trim().replace(/^\$\s*/, '').replace(/\.00?$/, '');
      return /^\d+$/.test(text) ? String(Number(text)) : text;
    }
    function wantedRates() { return { 50: rateValue(50), 25: rateValue(25) }; }
    function ratesChanged() { return [50, 25].some(function (minutes) { return rateValue(minutes) !== (published[minutes] || ''); }); }
    function rateWords(rates) {
      var listed = [50, 25].filter(function (minutes) { return rates[minutes]; }).map(function (minutes) { return '$' + rates[minutes] + ' for ' + minutes + ' minutes'; });
      return listed.length ? listed.join(', ') : 'none listed';
    }
    function badRate() {
      return [50, 25].filter(function (minutes) {
        var value = rateValue(minutes);
        return value && !(/^\d{1,3}$/.test(value) && Number(value) >= 1 && Number(value) <= 500);
      })[0];
    }
    app.appendChild(el('p', { text: 'Coaching is on Fridays 7 to 10 PM and Saturdays 3 to 6 PM, up to four weeks ahead. Pick a slot length, then tap Offer at a table to add a time; tap a time again to remove it. With 60 minutes, Offer covers the time you tap and the half hour after it. A 30 minute slot is booked as a 25 minute lesson and a 60 minute slot as a 50 minute lesson. A student may also ask for 25 minutes in either half of a 60 minute slot; that splits it into two 30 minute slots and the other half stays open. Two 30 minute slots in a row at one table can also be booked together as one 50 minute lesson. Times with a student on them cannot be changed here.' }));
    var picker = el('div', { 'class': 'lengths', role: 'group', 'aria-label': 'Slot length' });
    [30, 60].forEach(function (minutes) {
      var button = el('button', { type: 'button', text: minutes + ' minutes', 'data-minutes': String(minutes) });
      button.addEventListener('click', function () { length = minutes; draw(); });
      picker.appendChild(button);
    });
    app.appendChild(picker);
    app.appendChild(el('p', { 'class': 'legend', text: 'Green: your published time. Dashed: new, not published yet. Struck out: will be removed. Amber: a student has it. Grey: another coach.' }));
    var grids = el('div');
    app.appendChild(grids);
    var summary = el('p', { 'class': 'card' });
    var submit = el('button', { type: 'button', text: (by === 'email and text' ? 'Email and text' : by === 'text' ? 'Text' : 'Email') + ' me to confirm' });
    app.appendChild(summary);
    app.appendChild(el('div', { 'class': 'actions' }, [submit]));
    submit.addEventListener('click', function () {
      var bad = badRate();
      if (bad) {
        report(rateForm, 'Please enter your ' + bad + ' minute rate in whole dollars, from $1 to $500, or leave it blank.', 'error', 'rate' + bad, rateFields);
        return;
      }
      resetStatus(rateForm);
      show('Sending...');
      guarded(submit, 'coachPropose', [data.id, wanted, wantedRates()], function (result) {
        if (result.ok) { coachBoard(data.id, result.message); window.scrollTo(0, 0); }
        else if (rateFields[result.field]) { show(''); report(rateForm, result.message, 'error', result.field, rateFields); }
        else { show(result.message, 'error'); messageBox.scrollIntoView({ block: 'nearest' }); }
      });
    });

    function draw() {
      Array.prototype.forEach.call(picker.children, function (button) {
        var on = Number(button.getAttribute('data-minutes')) === length;
        button.className = on ? '' : 'plain';
        button.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      clear2(grids);
      data.days.forEach(function (day) {
        grids.appendChild(el('div', { 'class': 'day', text: day.day }));
        grids.appendChild(coachGrid(day));
      });
      var wantedKeys = wanted.map(slotKey);
      var adds = wantedKeys.filter(function (key) { return baseKeys.indexOf(key) < 0; }).length;
      var removes = baseKeys.filter(function (key) { return wantedKeys.indexOf(key) < 0; }).length;
      var rates = ratesChanged() && !badRate();
      var changes = (adds || removes ? [adds + ' to add, ' + removes + ' to remove'] : []).concat(rates ? ['your new rates (' + rateWords(wantedRates()) + ')'] : []);
      summary.textContent = changes.length ?
        'Ready to send: ' + changes.join(', and ') + '. Tap the button and we will send you the list by ' + by + '. Nothing changes until you reply YES.' :
        'No changes yet. Tap Offer to add a time, tap one of your times to remove it, or change your rates above.';
      submit.disabled = !data.ready || !(changes.length || ratesChanged());
      rateNote.textContent = ratesChanged() ? 'Not published yet: tap "' + submit.textContent + '" at the bottom of the page, then reply YES.' :
        'Published: ' + rateWords(published) + '.';
    }

    // Cells on one day, as {table, first, span, entry or slot, kind}.
    function cells(day) {
      var begin = toMinutes(day.start);
      var list = [];
      function add(slot, minutes, table, kind, entry) {
        list.push({ table: table, first: (toMinutes(slot.start) - begin) / 30, span: minutes / 30, kind: kind, slot: slot, entry: entry });
      }
      others.forEach(function (entry) { if (entry.date === day.date) add(entry, entry.slot, entry.table, 'other', entry); });
      held.forEach(function (entry) { if (entry.date === day.date) add(entry, entry.slot, entry.table, 'held', entry); });
      var wantedKeys = wanted.map(slotKey);
      baseline.forEach(function (slot) { if (slot.date === day.date && wantedKeys.indexOf(slotKey(slot)) < 0) add(slot, slot.minutes, slot.table, 'removing'); });
      wanted.forEach(function (slot) { if (slot.date === day.date) add(slot, slot.minutes, slot.table, baseKeys.indexOf(slotKey(slot)) < 0 ? 'draft' : 'mine'); });
      return list;
    }

    function coachGrid(day) {
      var begin = toMinutes(day.start);
      var rows = (toMinutes(day.end) - begin) / 30;
      var list = cells(day);
      var used = {};
      list.forEach(function (cell) { for (var step = 0; step < cell.span; step += 1) used[cell.table + ':' + (cell.first + step)] = true; });
      // Two tables are drawn; the third once neither has room for the chosen length at some time, or something is already on it.
      var columns = Math.min(2, data.tables);
      var span = length / 30;
      var blocked = function (table, r) { for (var step = 0; step < span; step += 1) if (used[table + ':' + (r + step)]) return true; return false; };
      for (var r = 0; r + span <= rows; r += 1) if (blocked(1, r) && blocked(2, r)) columns = data.tables;
      list.forEach(function (cell) { columns = Math.max(columns, cell.table); });
      var grid = el('div', { 'class': 'grid', style: 'grid-template-columns: 64px repeat(' + columns + ', minmax(0, 1fr)); grid-template-rows: auto repeat(' + rows + ', minmax(54px, auto));' });
      var place = function (row, span, table) { return 'grid-row: ' + (row + 2) + ' / span ' + span + '; grid-column: ' + (table + 1) + ';'; };
      grid.appendChild(el('div'));
      for (var table = 1; table <= columns; table += 1) grid.appendChild(tableHead(day, table, used, rows));
      for (var row = 0; row < rows; row += 1) grid.appendChild(el('div', { 'class': 'gtime', style: 'grid-row: ' + (row + 2) + '; grid-column: 1;', text: time12(fromMinutes(begin + row * 30)) }));
      list.forEach(function (cell) { grid.appendChild(coachCell(cell, place(cell.first, cell.span, cell.table))); });
      var offers = {};
      for (table = 1; table <= columns; table += 1) {
        for (row = 0; row < rows; row += 1) {
          if (used[table + ':' + row]) continue;
          grid.appendChild(offers[table + ':' + row] = offerButton(day, table, row, used, rows, place(row, 1, table), offers));
        }
      }
      return grid;
    }

    function tableHead(day, table, used, rows) {
      var head = el('div', { 'class': 'thead' }, [el('div', { text: 'Table ' + table })]);
      var free = 0;
      for (var row = 0; row < rows; row += 1) if (!used[table + ':' + row]) free += 1;
      if (!free) return head;
      var all = el('button', { type: 'button', 'class': 'plain', text: 'Offer all slots', 'aria-label': 'Offer every open time at Table ' + table + ' on ' + day.day });
      all.addEventListener('click', function () { offerAll(day, table, used, rows); });
      head.appendChild(all);
      return head;
    }

    // Fills each open stretch of one table that day: the chosen length where it fits, 30 minutes where it does not.
    function offerAll(day, table, used, rows) {
      var added = 0;
      var free = function (row, count) { for (var step = 0; step < count; step += 1) if (row + step >= rows || used[table + ':' + (row + step)]) return false; return true; };
      for (var row = 0; row < rows;) {
        var start = fromMinutes(toMinutes(day.start) + row * 30);
        var take = [length / 30, 1].filter(function (count) { return free(row, count) && !overlapsMine(day.date, start, count * 30); })[0];
        if (!take) { row += 1; continue; }
        wanted.push({ date: day.date, start: start, minutes: take * 30, table: table });
        added += 1;
        row += take;
      }
      if (added) show(''); else show('Every open time at Table ' + table + ' that day overlaps another of your times.', 'error');
      draw();
    }

    function overlapsMine(date, start, minutes) {
      var from = toMinutes(start);
      return wanted.concat(held.map(function (entry) { return { date: entry.date, start: entry.start, minutes: entry.slot }; })).some(function (slot) {
        var other = toMinutes(slot.start);
        return slot.date === date && from < other + Number(slot.minutes) && other < from + minutes;
      });
    }

    function coachCell(cell, style) {
      var when = time12(cell.slot.start).replace(/ (AM|PM)$/, '') + ' to ' + time12(fromMinutes(toMinutes(cell.slot.start) + (cell.entry ? cell.entry.slot : cell.slot.minutes)));
      if (cell.kind === 'other') return el('div', { 'class': 'tbl taken', style: style }, [el('b', { text: cell.entry.coach }), el('span', { text: when })]);
      if (cell.kind === 'held') {
        var step = cell.entry.change ? (cell.entry.change === 'cancel' ? 'Cancel' : 'Move') + ' requested: waiting for the student to confirm' : cell.entry.status === 'booked' ? '' :
          cell.entry.waiting === 'coach' ? 'Your YES needed: reply to our message' : 'Waiting for the student to confirm';
        return el('div', { 'class': 'tbl held', style: style }, [el('b', { text: cell.entry.student + (cell.entry.status === 'booked' ? ' booked' : ' requested') }), el('span', { text: when }),
          step ? el('span', { 'class': 'step', text: step }) : null]);
      }
      var text = { mine: 'Yours', draft: 'New', removing: 'Removing' }[cell.kind];
      var button = el('button', { type: 'button', 'class': 'tbl ' + cell.kind, style: style, 'aria-label': text + ', Table ' + cell.table + ', ' + when + (cell.kind === 'removing' ? ', tap to keep' : ', tap to remove') }, [el('b', { text: text }), el('span', { text: when })]);
      button.addEventListener('click', function () {
        show('');
        if (cell.kind === 'removing') wanted.push({ date: cell.slot.date, start: cell.slot.start, minutes: cell.slot.minutes, table: cell.slot.table });
        else wanted = wanted.filter(function (slot) { return slot !== cell.slot; });
        draw();
      });
      return button;
    }

    function offerButton(day, table, row, used, rows, style, offers) {
      var start = fromMinutes(toMinutes(day.start) + row * 30);
      var end = time12(fromMinutes(toMinutes(start) + length));
      var label = el('span', { text: 'Offer' });
      var button = el('button', { type: 'button', 'class': 'tbl free', style: style, 'aria-label': 'Offer ' + time12(start) + ' to ' + end + ', Table ' + table }, [label]);
      // Before the tap, show every half hour the offer would cover.
      var reach = function (on) {
        var span = length / 30;
        var fits = row + span <= rows;
        for (var step = 1; step < span; step += 1) if (used[table + ':' + (row + step)]) fits = false;
        label.textContent = !on ? 'Offer' : fits ? time12(start).replace(/ (AM|PM)$/, '') + ' to ' + end : 'No room for ' + length + ' min';
        button.classList.toggle(fits ? 'reach' : 'nofit', on);
        if (fits) for (step = 1; step < span; step += 1) {
          var below = offers[table + ':' + (row + step)];
          below.classList.toggle('reach', on);
          below.firstChild.textContent = on ? '' : 'Offer';
        }
      };
      button.addEventListener('pointerenter', function () { reach(true); });
      button.addEventListener('pointerleave', function () { reach(false); });
      button.addEventListener('focus', function () { reach(true); });
      button.addEventListener('blur', function () { reach(false); });
      button.addEventListener('click', function () {
        var span = length / 30;
        if (row + span > rows) { show('A ' + length + ' minute time would run past the end of coaching that day.', 'error'); return; }
        if (span > 1 && used[table + ':' + (row + 1)]) { show('Table ' + table + ' is not free for the whole ' + length + ' minutes. Try another table or 30 minutes.', 'error'); return; }
        if (overlapsMine(day.date, start, length)) { show('That overlaps another of your times.', 'error'); return; }
        show('');
        wanted.push({ date: day.date, start: start, minutes: length, table: table });
        draw();
      });
      return button;
    }

    draw();
  }

  function toMinutes(time) { return Number(time.slice(0, 2)) * 60 + Number(time.slice(3, 5)); }
  function fromMinutes(minutes) { return ('0' + Math.floor(minutes / 60)).slice(-2) + ':' + ('0' + (minutes % 60)).slice(-2); }
  function time12(time) {
    var hour = Number(time.slice(0, 2));
    return ((hour + 11) % 12 + 1) + ':' + time.slice(3, 5) + ' ' + (hour < 12 ? 'AM' : 'PM');
  }

  // ----- Start -----
  function tabs() {
    var book = el('button', { type: 'button', 'class': 'on', text: 'Book a lesson' });
    var coach = el('button', { type: 'button', text: 'I am a coach' });
    book.addEventListener('click', function () { book.className = 'on'; coach.className = ''; bookingView(); });
    coach.addEventListener('click', function () { coach.className = 'on'; book.className = ''; coachPicker(true); });
    app.parentNode.insertBefore(el('div', { 'class': 'tabs' }, [book, coach]), messageBox);
  }

  tabs();
  if (INITIAL) Object.keys(INITIAL).forEach(function (name) {
    if (INITIAL[name]) preloaded[name + '[]'] = { at: Date.now(), result: INITIAL[name], waiting: [] };
  });
  bookingView();
  preload('coachList', []);
  if (saved('cttc-coach')) preload('coachBoard', [saved('cttc-coach')]);
  // The club page shows its own loading note until this arrives. The message carries no data.
  try { window.top.postMessage('cttc-coaching-ready', '*'); } catch (error) {}
</script>
</body>
</html>
