<script src="navtoggle.js"></script>

<script>
  (function () {
    // The sign-up app (subscribe-app/) shows the form. A link from the confirmation email carries a signed token,
    // which is passed on only if it has the expected shape.
    var APP_URL = 'https://script.google.com/macros/s/AKfycbysF4ypVNa37kOGN5HiXW19FCUInzOfGcW7eHzOp61vybjzfWcJK1X7XsuCxn5kdG04Kw/exec';
    var token = new URLSearchParams(location.search).get('t') || '';
    var valid = /^[A-Za-z0-9_-]{10,600}\.[A-Za-z0-9_-]{20,100}$/.test(token);
    document.getElementById('unsubscribe-frame').src = APP_URL + (valid ? '?page=confirm&t=' + token : '?page=unsubscribe');
  })();
</script>
