<style id="eq-guide-style">
/* The Equalizer's teaser (under the Round robin | Equalizer switch) and its guide: a large window of made-up desk
   screens, walked through with the desk tour's spotlight (a gold outline over the dimmed screen) and callout card. */
.eqg-teaser{position:fixed;z-index:1500;width:min(370px,calc(100vw - 24px));padding:15px 16px 13px;background:#fff;color:var(--ink);border:1px solid #b8c5bc;border-top:4px solid var(--gold);border-radius:6px;box-shadow:0 14px 36px #17211b44;font:14px/1.45 Arial,sans-serif}
.eqg-teaser[hidden]{display:none}
.eqg-teaser h2{font:700 19px/1.25 Georgia,serif;margin:0 24px 6px 0}
.eqg-teaser p{margin:0 0 8px}
.eqg-teaser .eqg-tag{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:9px;background:var(--red);color:#fff;font:700 11px Arial,sans-serif;vertical-align:2px}
.eqg-teaser footer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.eqg-teaser label{display:flex;align-items:center;gap:5px;margin-right:auto;font-size:12px;color:var(--muted)}
.eqg-x{position:absolute;right:10px;top:8px;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.eqg{position:fixed;inset:0;z-index:2050;display:grid;place-items:center;padding:12px;background:rgba(10,19,17,.62)}
.eqg[hidden]{display:none}
.eqg-window{position:relative;display:flex;flex-direction:column;width:min(1180px,100%);height:min(880px,calc(100dvh - 24px));overflow:hidden;background:var(--paper);border:1px solid #b8c5bc;border-radius:8px;box-shadow:0 18px 50px #0007}
.eqg-head{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#123f2b;color:#fff;border-bottom:4px solid var(--gold)}
.eqg-head h2{margin:0;font:700 23px/1.15 Georgia,serif}
.eqg-head p{margin:2px 0 0;color:#dce9e1;font:12px Arial,sans-serif}
.eqg-head .eqg-x{position:static;margin-left:auto;color:#fff;font-size:28px}
.eqg-chapters{display:flex;gap:6px;overflow-x:auto;padding:9px 18px;background:#fff;border-bottom:1px solid var(--line)}
.eqg-chapters button{flex:none;padding:6px 11px;border:1px solid #c9d2cc;border-radius:999px;background:#fff;color:var(--ink);font:13px Arial,sans-serif;cursor:pointer}
.eqg-chapters button[aria-current="true"]{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.eqg-stage{position:relative;flex:1;overflow:auto;padding:22px 26px 300px;font:14px/1.45 Arial,sans-serif}
.eqg-stage .match,.eqg-stage .ball,.eqg-stage .winner-badge{pointer-events:none}
.eqg-stage h3{margin:0 0 10px;font:700 21px/1.2 Georgia,serif}
.eqg-note{margin:0 0 14px;color:var(--muted);font:13px Arial,sans-serif}
.eqg-spot{position:absolute;z-index:5;border:3px solid #d4a544;border-radius:6px;box-shadow:0 0 0 3px #fff9,0 0 0 5000px rgba(10,19,17,.55);pointer-events:none;transition:left .35s ease-in-out,top .35s ease-in-out,width .35s ease-in-out,height .35s ease-in-out}
.eqg-spot[hidden]{display:none}
.eqg-callout{position:absolute;z-index:6;width:min(390px,calc(100% - 24px));padding:18px 20px 14px;background:#fff;color:var(--ink);border:1px solid #b8c5bc;border-radius:6px;box-shadow:0 16px 45px #0006;font:15px/1.5 Arial,sans-serif;transition:left .3s ease-in-out,top .3s ease-in-out}
.eqg-callout h2{margin:0 0 8px;font:700 20px/1.25 Georgia,serif}
.eqg-callout p{margin:0 0 14px}
.eqg-callout footer{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.eqg-callout .eqg-progress{margin-right:auto;color:var(--muted);font-size:12px}
.eqg-callout footer button{font:13px Arial,sans-serif;cursor:pointer}
.eqg-callout .eqg-next{padding:8px 13px;border:1px solid var(--green);border-radius:4px;background:var(--green);color:#fff}
.eqg-callout .eqg-back{padding:8px 4px;border:0;background:transparent;color:var(--green)}
.eqg button:focus-visible,.eqg-teaser button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.eqg-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 18px;padding:0;list-style:none}
.eqg-card{padding:14px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--green);border-radius:6px}
.eqg-card strong{display:block;margin:8px 0 4px;font:700 16px Georgia,serif}
.eqg-board{display:inline-flex;gap:4px}
.eqg-board span{display:inline-grid;place-items:center;width:30px;height:38px;background:#17211b;color:#ffd27a;border-radius:4px;font:700 22px Arial,sans-serif}
.eqg-lede{margin:0 0 6px;font:18px/1.4 Georgia,serif}
.eqg-panel{margin:0 0 16px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:6px}
.eqg-table{border-collapse:collapse;font:13px Arial,sans-serif}
.eqg-table th,.eqg-table td{padding:5px 12px;border-bottom:1px solid #edf0ed;text-align:left}
.eqg-table th{color:var(--muted);font-size:12px}
.eqg-memory{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.eqg-memory li{padding:10px 12px;background:#f7f9f7;border:1px solid var(--line);border-radius:6px}
.eqg-memory b{display:block;font-size:12px;color:var(--muted)}
.eqg-toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:0 0 14px}
.eqg-toolbar .group-size button[aria-pressed="true"]{background:var(--green);color:#fff}
.eqg-sheet{overflow:hidden;margin:0 0 16px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px #17211b22}
.eqg-sheet .print-sheet{box-shadow:none;margin:0;transform-origin:0 0}
.eqg-sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.eqg-sheets figure{margin:0}
.eqg-sheets figcaption{margin:0 0 6px;font:700 13px Arial,sans-serif}
.eqg-teams li{margin:0 0 6px}
.eqg-list{margin:0;padding-left:20px}
.eqg-list li{margin:0 0 7px}
@media(max-width:640px){
  .eqg{padding:0}
  .eqg-window{height:100dvh;border-radius:0}
  .eqg-stage{padding:16px 14px 340px}
  .eqg-callout{left:8px!important;right:8px;width:auto;bottom:8px;top:auto!important}
}
@media(prefers-reduced-motion:reduce){.eqg-spot,.eqg-callout{transition:none}}
</style>
<script>
// The Equalizer teaser and guide. Choosing Equalizer on the Round robin | Equalizer switch shows a teaser under the
// switch (until "Don't show this again" on this device); its How it works, or the ? button while the desk is on the
// Equalizer, opens the guide: chapters of made-up desk screens (the mockup's players, on the real rules in
// EqualizerRulesPage.html and the real printouts in EqualizerPrint.html), walked through step by step with a spotlight
// and a callout, like the desk tour. Nothing in the guide touches the desk or Google.
(function () {
  var E = window.CTTCEqualizer;
  var BYE = window.CTTCBracket.BYE;
  var TEASER_OFF = 'cttc-eq-teaser-off-v1';
  var switcher = document.getElementById('event-switch');
  var launcher = document.getElementById('show-tour');

  // The mockup's made-up players (equalizer-mockup.js): ratings spread like the club's.
  var PEOPLE = [
    ['Avery Lin', 2100], ['Bea Torres', 1785], ['Cal Okafor', 1690], ['Dana Wu', 1550], ['Eli Novak', 1440], ['Faye Moreno', 1380],
    ['Gus Patel', 1280], ['Hana Sato', 1195], ['Ivo Rossi', 1145], ['Jo Mensah', 1125], ['Kai Larsen', 1085], ['Lena Brandt', 965],
    ['Milo Reyes', 815], ['Nia Osei', 745], ['Omar Haddad', 670], ['Pia Lund', 625], ['Quinn Achebe', 590], ['Rui Costa', 560],
    ['Sana Iqbal', 515], ['Theo Marsh', 495], ['Uma Varga', 400], ['Vik Rao', 365], ['Wren Doyle', 330], ['Yuki Mori', 255]
  ].map(function (row, index) { return { id: 'p' + index, name: row[0], rating: row[1] }; });
  var BY_ID = {};
  PEOPLE.forEach(function (p) { BY_ID[p.id] = p; });

  function esc(value) { return String(value).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function rng(seed) {
    var value = seed;
    return function () { value = (value * 16807) % 2147483647; return (value - 1) / 2147483646; };
  }
  function pick(indexes) { return indexes.map(function (i) { return PEOPLE[i]; }); }
  function makeEvent(format, play, people, seed, extra) {
    var setup = Object.assign({ format: format, play: play, bestOf: 3, oddPlayer: 'sit-out', players: people.map(function (p) { return { id: p.id, rating: p.rating }; }) }, extra || {});
    return E.fromSnapshot(E.draw(setup, rng(seed)));
  }
  function names(ev, sideId) { return ev.sideById[sideId].members.map(function (id) { return BY_ID[id].name; }); }
  function first(ev, sideId) { return names(ev, sideId).map(function (n) { return n.split(' ')[0]; }).join(' & '); }
  // Plays matches that are ready and pass the filter, on made-up but even coin flips (the head start's whole point).
  function play(ev, filter, seed, results) {
    var random = rng(seed);
    results = results || {};
    for (var guard = 0; guard < 200; guard += 1) {
      var ready = E.resolve(ev, results).matches.filter(function (m) { return m.status === 'ready' && filter(m); });
      if (!ready.length) break;
      ready.forEach(function (m) {
        var need = (m.bestOf + 1) / 2;
        var winner = random() < 0.5 ? 0 : 1;
        var other = Math.floor(random() * need);
        results[m.id] = { winnerId: m.players[winner], games: winner ? [other, need] : [need, other] };
      });
    }
    return results;
  }
  function minutesText(minutes) { return minutes >= 60 ? Math.floor(minutes / 60) + ' h' + (minutes % 60 ? ' ' + (minutes % 60) + ' min' : '') : minutes + ' min'; }

  // ---- Desk-like pieces, drawn with the desk's own classes ----
  function balls(m, side, games) {
    var need = (m.bestOf + 1) / 2;
    var out = '<div class="score-set score-' + (side ? 'two' : 'one') + '"><span class="score-caption">Games won</span><div class="balls">';
    for (var n = 0; n <= need; n += 1) {
      var on = games != null && (n === 0 ? games === 0 : games >= n);
      out += '<span class="ball' + (n === 0 ? ' zero' : '') + (on ? ' on' : '') + '">' + n + '</span>';
    }
    return out + '</div></div>';
  }
  function matchRow(ev, m, options) {
    options = options || {};
    var hs = E.headStart(ev, m.players[0], m.players[1], []);
    var games = m.result && m.result.games ? m.result.games : options.games || [null, null];
    var winnerId = m.status === 'done' ? m.winnerId : null;
    function cell(side) {
      var id = m.players[side];
      var chip = hs.lowerId === id && hs.headStart ? '<span class="eq-chip">+' + hs.headStart + '</span>' : '';
      var badge = winnerId === id ? '<span class="winner-badge on">Winner <span class="check" aria-hidden="true">✓</span></span>' : options.cutShort === side ? '<span class="winner-badge" data-g="winner">Winner</span>' : '<span class="winner-badge">Winner</span>';
      return '<div class="player-cell player-' + (side ? 'two' : 'one') + '"><strong>' + names(ev, id).map(function (n) { return '<span class="eq-team">' + esc(n) + '</span>'; }).join('') + '</strong><span class="eq-rating">' + ev.sideRatings[id] + (ev.play === 'doubles' ? ' avg' : '') + chip + '</span>' + badge + '</div>';
    }
    var hsText = hs.lowerId && hs.headStart ? first(ev, hs.lowerId) + ' start' + (ev.play === 'doubles' ? '' : 's') + ' every game at ' + hs.headStart + '–0' : 'No head start';
    return '<div class="match match-' + (winnerId ? 'complete' : 'pending') + '"' + (options.attr ? ' data-g="' + options.attr + '"' : '') + '>' + cell(0) + balls(m, 0, games[0]) + '<span class="dash">–</span>' + balls(m, 1, games[1]) + cell(1) +
      '<div class="match-foot"><span class="eq-foot">' + esc(m.id) + ' · best of ' + m.bestOf + ' · ' + esc(hsText) + '</span>' + (options.forfeit ? '<label class="forfeit" data-g="forfeit">Forfeit <select tabindex="-1"><option>None</option></select></label>' : '') + '</div></div>';
  }
  function groupSection(ev, view, table, attrs) {
    attrs = attrs || {};
    var rows = table.order.map(function (sideId) {
      var row = table.rows.filter(function (r) { return r.id === sideId; })[0];
      var won = table.complete && table.winnerId === sideId;
      return '<tr' + (won ? ' class="leader"' : '') + '><td>' + (won ? '🏆 ' : '') + esc(names(ev, sideId).join(' & ')) + '</td><td>' + row.wins + '-' + row.losses + '</td><td>' + row.gamesWon + '-' + row.gamesLost + '</td><td>' + ev.sideRatings[sideId] + '</td></tr>';
    }).join('');
    var matches = view.matches.filter(function (m) { return m.bracket === 'G' && m.group === table.number; });
    return '<section class="match-group"><h3><span class="group-title">Group ' + table.number + '</span><span class="count">' + table.played + ' / ' + table.total + ' complete</span></h3>' +
      '<table class="standings"' + (attrs.table ? ' data-g="' + attrs.table + '"' : '') + '><thead><tr><th>Player</th><th>W-L</th><th>Games</th><th>Rating</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      matches.map(function (m, i) { return matchRow(ev, m, { attr: i === 0 ? attrs.match : '' }); }).join('') + '</section>';
  }
  function roundName(ev, m) {
    if (m.bracket === 'G') return 'Group ' + m.group + ' · round ' + m.round;
    if (m.bracket === 'F') return m.round === 1 ? 'Final' : 'Final replay';
    if (m.bracket === 'L') return m.round === ev.bracket.trailRounds ? 'Survivor Trail final' : 'Survivor Trail · round ' + m.round;
    var fromEnd = ev.bracket.rounds - m.round;
    var prefix = ev.format === 'groups' ? '' : 'Main Draw ';
    return fromEnd === 0 ? (ev.format === 'groups' ? 'Final' : 'Main Draw final') : fromEnd === 1 ? prefix + 'Semifinals' : fromEnd === 2 ? prefix + 'Quarterfinals' : (ev.format === 'groups' ? 'Finals' : 'Main Draw') + ' · round ' + m.round;
  }
  // The same data the desk hands its printouts (Equalizer.html printData), for a made-up event.
  function printData(ev, results) {
    var view = E.resolve(ev, results);
    return {
      date: '2026-11-07', event: ev, view: view,
      names: function (sideId) { return names(ev, sideId); },
      playerName: function (id) { return BY_ID[id].name; },
      headStart: function (m) { return E.headStart(ev, m.players[0], m.players[1], []); },
      roundName: function (m) { return roundName(ev, m); }
    };
  }
  // A printed sheet, shrunk to fit its box (the real sheet: 8.5 or 11 inches wide).
  function sheetFigure(sheet, attr, caption) {
    var holder = document.createElement('figure');
    if (caption) holder.innerHTML = '<figcaption>' + esc(caption) + '</figcaption>';
    var frame = document.createElement('div');
    frame.className = 'eqg-sheet';
    if (attr) frame.setAttribute('data-g', attr);
    frame.appendChild(sheet);
    holder.appendChild(frame);
    return holder;
  }
  function fitSheets(stage) {
    stage.querySelectorAll('.eqg-sheet').forEach(function (frame) {
      var sheet = frame.firstChild;
      var natural = sheet.classList.contains('print-bracket-sheet') ? 1056 : 816;
      var tall = sheet.classList.contains('print-bracket-sheet') ? 816 : 1056;
      var scale = Math.min(1, (frame.clientWidth || natural) / natural);
      sheet.style.width = natural + 'px';
      sheet.style.minHeight = tall + 'px';
      sheet.style.transform = 'scale(' + scale + ')';
      frame.style.height = Math.ceil(tall * scale) + 'px';
    });
  }

  // ---- The made-up evenings ----
  var groupsEvent = makeEvent('groups', 'singles', pick([0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 19, 22]), 11);
  var groupsResults = play(groupsEvent, function (m) { return m.bracket === 'G'; }, 5);
  var doubleEvent = makeEvent('double', 'singles', pick([1, 3, 6, 8, 10, 13, 15, 18]), 23);
  var doubleResults = play(doubleEvent, function (m) { return m.bracket === 'W' && m.round === 1; }, 7);
  var doublesEvent = makeEvent('groups', 'doubles', pick([0, 3, 5, 7, 9, 12, 14, 17, 20, 21, 22, 23, 1]), 31, { oddPlayer: 'team-of-three' });
  var smallEvent = makeEvent('double', 'singles', pick([2, 6, 11, 17]), 41);
  var smallResults = play(smallEvent, function () { return true; }, 9);

  // ---- Scenes: each chapter's made-up screen ----
  var scenes = {
    intro: function () {
      return '<h3>The Equalizer</h3><p class="eqg-lede" data-g="lede">Same club, same players, a new way to play: a head start in every game evens up every match, in singles or doubles.</p>' +
        '<p class="eqg-note">A second rated event the desk can run on any night instead of the round robin. Same sign-in, same fee (someone in both pays once). The players on these screens are made up; nothing here is saved.</p>' +
        '<ol class="eqg-cards">' +
        '<li class="eqg-card" data-g="draw"><span class="eqg-board"><span>?</span><span>?</span></span><strong>The draw</strong>Everyone signed in goes into a random draw, for singles or random doubles partners. No seeds: you could meet anyone.</li>' +
        '<li class="eqg-card" data-g="head"><span class="eqg-board"><span>5</span><span>0</span></span><strong>Your head start</strong>Every full 40 rating points between you is 1 point at the start of every game, up to 8.</li>' +
        '<li class="eqg-card" data-g="ways"><span class="eqg-board"><span>2</span><span>×</span></span><strong>Two ways to play</strong><em>RR → Finals:</em> win your group of 4 to reach the Finals. <em>Double Elimination:</em> lose once and play on along the Survivor Trail.</li>' +
        '<li class="eqg-card" data-g="points"><span class="eqg-board"><span>±</span><span>8</span></span><strong>8 points on the line</strong>Every match is worth 8 rating points, whoever you play: win and gain 8, lose and give 8. In doubles, both partners.</li>' +
        '</ol>';
    },
    headstart: function () {
      var ev = makeEvent('double', 'singles', pick([4, 7, 0, 23]), 3);
      var m = { id: 'W1-1', bestOf: 3, players: [PEOPLE[4].id, PEOPLE[7].id], status: 'ready' };
      var rows = [[0, 39, 'none'], [40, 79, '+1'], [120, 159, '+3'], [240, 279, '+6'], [320, null, '+8 (the most)']].map(function (r) {
        return '<tr><td>' + r[0] + (r[1] ? '–' + r[1] : ' or more') + '</td><td><strong>' + r[2] + '</strong></td></tr>';
      }).join('');
      return '<h3>Head starts</h3><p class="eqg-note">Eli Novak (1440) plays Hana Sato (1195): 245 points apart, so Hana starts every game at 6–0.</p>' +
        '<div class="matches">' + matchRow(ev, m, { attr: 'match' }) + '</div>' +
        '<div class="eqg-panel" data-g="table"><table class="eqg-table"><thead><tr><th>Rating gap</th><th>Head start, every game</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<div class="eqg-panel" data-g="memory"><strong>The pair remembers</strong><ol class="eqg-memory">' +
        '<li><b>First meeting</b>Hana +6. Hana wins.</li><li><b>Next time</b>Hana +5: a win by the lower-rated player takes 1 off her next head start against Eli.</li><li><b>Then</b>Eli wins: Hana gets 1 back (+6), never more than the gap gives.</li>' +
        '</ol></div>';
    },
    desk: function () {
      var seg = function (label, values, current) {
        return '<div class="group-size" role="group"><span>' + label + '</span>' + values.map(function (v) { return '<button type="button" tabindex="-1" aria-pressed="' + (v === current) + '">' + v + '</button>'; }).join('') + '</div>';
      };
      var roster = pick([0, 2, 4, 5, 7, 9, 11, 12]).map(function (p) { return '<li><div class="identity"><strong>' + esc(p.name) + '</strong><span>Rating ' + p.rating + '</span></div></li>'; }).join('');
      return '<h3>On the desk</h3><p class="eqg-note">Sign players in from the directory or Voice signups as on any night, then choose the event.</p>' +
        '<div class="eqg-toolbar"><div class="group-size event-switch" role="group" data-g="switch"><button type="button" tabindex="-1" aria-pressed="false">Round robin</button><button type="button" tabindex="-1" aria-pressed="true">Equalizer</button></div>' +
        '<div class="eqg-toolbar" data-g="options" style="margin:0">' + seg('Format', ['RR → Finals', 'Double Elimination'], 'RR → Finals') + seg('Play', ['Singles', 'Doubles'], 'Singles') + seg('Best of', ['3', '5'], '3') + '<button type="button" class="secondary" tabindex="-1">Draw again</button></div></div>' +
        '<div class="eqg-toolbar" data-g="actions"><button type="button" class="secondary" tabindex="-1">Print EQ Sheets</button><button type="button" class="secondary" tabindex="-1">Clear</button><button type="button" class="primary danger" tabindex="-1">Finalize Equalizer</button></div>' +
        '<article class="group eq-roster" data-g="roster" style="max-width:420px"><div class="group-head"><strong>Equalizer players</strong><span class="count">8 players</span></div><ul class="group-list">' + roster + '</ul></article>';
    },
    groups: function () {
      var view = E.resolve(groupsEvent, groupsResults);
      var est = E.estimate(groupsEvent).minutes;
      var finals = view.matches.filter(function (m) { return m.bracket === 'W' && m.status !== 'bye'; });
      return '<h3>RR → Finals</h3><p class="group-summary" data-g="summary">12 players · ' + groupsEvent.groups.length + ' groups of 4 · best of 3 · about ' + minutesText(est) + ' · ' + view.matches.filter(function (m) { return m.status === 'done'; }).length + ' matches complete</p>' +
        '<div class="matches">' + view.tables.map(function (t, i) { return groupSection(groupsEvent, view, t, i === 0 ? { table: 'table', match: 'match' } : {}); }).join('') +
        '<section class="match-group" data-g="finals"><h3><span class="group-title">Finals</span><span class="count">0 / ' + finals.length + ' complete</span></h3><p class="eq-section-note">The Finals start once every group is decided; the best group winners get any byes.</p>' +
        finals.map(function (m) {
          if (m.status === 'waiting') return '<div class="match eq-waiting"><div class="player-cell player-one">' + (m.players[0] ? '<strong>' + esc(names(groupsEvent, m.players[0]).join(' & ')) + '</strong>' : 'Winner of an earlier match') + '</div><div class="score-set"></div><span class="dash">–</span><div class="score-set"></div><div class="player-cell player-two">Winner of ' + esc(groupsEvent.bracket.matches.filter(function (x) { return x.id === m.id; })[0].sources[1].winner || '') + '</div><div class="match-foot"><span class="eq-foot">' + m.id + ' · waiting for earlier results</span></div></div>';
          return matchRow(groupsEvent, m);
        }).join('') + '</section></div>';
    },
    double: function () {
      var holder = document.createElement('div');
      holder.innerHTML = '<h3>Double Elimination</h3><p class="eqg-note">8 players after the first round, as the desk prints it. Everyone plays at least twice.</p>';
      holder.appendChild(sheetFigure(window.cttcEqualizerPrint.sheets(printData(doubleEvent, doubleResults))[0], 'bracket'));
      return holder;
    },
    doubles: function () {
      var ev = doublesEvent;
      var teams = ev.sides.map(function (side) {
        var three = side.members.length > 2;
        return '<li' + (three ? ' data-g="three"' : '') + '><strong>' + esc(names(ev, side.id).join(' & ')) + '</strong> · ' + side.members.map(function (id) { return BY_ID[id].rating; }).join(' + ') + ' → <strong>' + side.rating + '</strong>' + (three ? ' (a team of three)' : '') + '</li>';
      }).join('');
      return '<h3>Doubles</h3><p class="eqg-note">13 players chose doubles: partners drawn at random.</p>' +
        '<div class="eqg-panel" data-g="teams"><strong>Teams play at the average of their ratings</strong><ul class="eqg-teams">' + teams + '</ul></div>' +
        '<div class="eq-notice" data-g="odd"><strong>13 players for doubles:</strong> choose how to handle the odd player, or add someone to fill in. <select tabindex="-1"><option>Someone drawn at random sits out</option><option>Avery Lin sits out</option><option selected>One team of three (rotates each game)</option></select></div>' +
        '<div class="matches">' + matchRow(ev, E.resolve(ev, {}).matches[0], { attr: 'match' }) + '</div>';
    },
    scoring: function () {
      var ev = makeEvent('double', 'singles', pick([2, 11, 6, 17]), 5, { bestOf: 5 });
      var view = E.resolve(ev, {});
      var ready = view.matches.filter(function (m) { return m.status === 'ready'; });
      var finished = E.resolve(smallEvent, smallResults);
      var results = E.playerResults(smallEvent, finished);
      var places = smallEvent.sides.map(function (s) { return { id: s.id, place: finished.places[s.id] }; }).filter(function (x) { return x.place; }).sort(function (a, b) { return a.place.place - b.place.place; });
      var ordinal = function (n) { return n + (['th', 'st', 'nd', 'rd'][n % 10 > 3 || Math.floor(n % 100 / 10) === 1 ? 0 : n % 10]); };
      return '<h3>Scoring and finishing</h3><p class="eqg-note">Score with the balls, exactly as in round robins. These two are best of 5.</p>' +
        '<div class="matches">' + matchRow(ev, ready[0], { attr: 'balls', games: [3, 1] }) + matchRow(ev, ready[1], { attr: 'cut', games: [2, 1], cutShort: 0, forfeit: true }) + '</div>' +
        '<div class="eq-champion" data-g="champion">🏆 <strong>' + esc(names(smallEvent, finished.champion).join(' & ')) + '</strong> wins the Equalizer. Check the results, then Finalize Equalizer.<ul class="eq-places">' +
        places.map(function (x) { var p = results[x.id]; return '<li><b>' + ordinal(x.place.place) + '</b>' + esc(BY_ID[x.id].name) + ' · ' + p.wins + '-' + p.losses + ' · ' + (p.change >= 0 ? '+' : '') + p.change + '</li>'; }).join('') + '</ul></div>';
    },
    print: function () {
      var holder = document.createElement('div');
      holder.innerHTML = '<h3>Printouts</h3><p class="eqg-note">Print EQ Sheets: the same button as Print RR Sheets, on an Equalizer night.</p>';
      var sheets = window.cttcEqualizerPrint.sheets(printData(groupsEvent, groupsResults));
      var row = document.createElement('div');
      row.className = 'eqg-sheets';
      row.append(sheetFigure(sheets[0], 'group-sheet', 'A group sheet'), sheetFigure(sheets[sheets.length - 1], 'finals-sheet', 'The Finals bracket'));
      holder.appendChild(row);
      return holder;
    },
    night: function () {
      var size = function (format, count, playType) {
        var people = PEOPLE.slice(0, count);
        return minutesText(E.estimate(makeEvent(format, playType || 'singles', people, 17)).minutes);
      };
      return '<h3>What to expect on the night</h3>' +
        '<div class="eqg-panel" data-g="times"><table class="eqg-table"><thead><tr><th>Players</th><th>RR → Finals</th><th>Double Elimination</th></tr></thead><tbody>' +
        [8, 12, 16, 24].map(function (n) { return '<tr><td>' + n + ' singles</td><td>' + size('groups', n) + '</td><td>' + size('double', n) + '</td></tr>'; }).join('') +
        '</tbody></table><p class="eqg-note" style="margin:8px 0 0">Rough playing time on 12 tables, best of 3. RR → Finals needs at least 6 players (12 for doubles), Double Elimination 4 (8); at most 24.</p></div>' +
        '<div class="eqg-panel" data-g="rules"><ul class="eqg-list">' +
        '<li>Players and the draw are fixed once the first result is in. Someone who arrives later plays Open Play.</li>' +
        '<li>A player who has to leave forfeits their remaining matches; forfeits move no rating points.</li>' +
        '<li>Payments, member badges, first visits and Clover work as on round robin nights: fees are per day.</li>' +
        '<li>A round robin and an Equalizer can share a day; each finalizes on its own.</li>' +
        '</ul></div>';
    }
  };

  // ---- The walkthrough: each step names its chapter's scene and the part of it to spotlight ----
  var CHAPTERS = [
    { id: 'intro', title: 'Overview' }, { id: 'headstart', title: 'Head starts' }, { id: 'desk', title: 'On the desk' },
    { id: 'groups', title: 'RR → Finals' }, { id: 'double', title: 'Double Elimination' }, { id: 'doubles', title: 'Doubles' },
    { id: 'scoring', title: 'Scoring & finishing' }, { id: 'print', title: 'Printouts' }, { id: 'night', title: 'The night' }
  ];
  var STEPS = [
    { scene: 'intro', target: 'lede', title: 'Meet the Equalizer', text: 'A rated event where a head start in every game gives everyone a real chance against anyone. This guide walks through it with made-up players; nothing here is saved.' },
    { scene: 'intro', target: 'draw', title: 'A random draw', text: 'No seeding by rating: the draw is random, so a 500 can meet a 2100 in the first round. The head start is what keeps that match close.' },
    { scene: 'intro', target: 'head', title: 'The head start', text: 'The lower-rated player starts every game ahead: 1 point for every full 40 rating points between the two, at most 8, so they still need at least 3 points to win a game.' },
    { scene: 'intro', target: 'ways', title: 'Two formats', text: 'The organizer picks RR → Finals (groups of 4, then a knockout for the group winners) or Double Elimination (nobody is out until they lose twice).' },
    { scene: 'intro', target: 'points', title: '8 points a match', text: 'Ratings move as if both players were equal: the winner gains 8 and the loser gives 8, every match. In doubles both partners do. A forfeit moves nothing.' },
    { scene: 'headstart', target: 'match', title: 'Head start on the desk', text: 'Every match shows the head start: the red +6 beside Hana, and "Hana starts every game at 6–0" underneath. Players see the same on the printed sheets.' },
    { scene: 'headstart', target: 'table', title: 'How big', text: 'Every full 40 points of rating gap is one point. 245 apart gives +6; 320 or more gives the most, +8.' },
    { scene: 'headstart', target: 'memory', title: 'The pair remembers', text: 'If the lower-rated player wins, their next head start against that same player is 1 smaller; if the higher-rated player wins, 1 comes back. It is worked out again from finalized Equalizers, so reopening one corrects it.' },
    { scene: 'desk', target: 'switch', title: 'Choose the Equalizer', text: 'The Round robin | Equalizer switch moves everyone signed in across at once (while the round robin has no results), and back again the same way.' },
    { scene: 'desk', target: 'options', title: 'The organizer’s choices', text: 'Format, Singles or Doubles, best of 3 or 5. Every change draws again at once; Draw again reshuffles. The defaults are RR → Finals, singles, best of 3.' },
    { scene: 'desk', target: 'roster', title: 'Players are fixed at the first result', text: 'Add or remove players until the first result is entered; the draw changes with them. After that the players, options and draw are fixed.' },
    { scene: 'desk', target: 'actions', title: 'Print and finalize', text: 'Print EQ Sheets prints group sheets and brackets. Finalize Equalizer, once it is finished, moves every rating; its lock reopens it, as for round robins.' },
    { scene: 'groups', target: 'summary', title: 'RR → Finals', text: 'Groups of 4 (or 3 when the numbers need it), drawn at random. The summary shows the groups, the format and a rough finish time.' },
    { scene: 'groups', target: 'table', title: 'Group standings', text: 'Live standings with the club’s round robin tie-break rules. The group winner (🏆) goes to the Finals.' },
    { scene: 'groups', target: 'match', title: 'Group matches', text: 'Each match shows both ratings and the head start. Tap the balls to score, as in round robins.' },
    { scene: 'groups', target: 'finals', title: 'The Finals', text: 'A knockout for the group winners, once every group is decided. With 3 groups the best group winner (the best share of games won, then fewest lost) gets a bye to the Final.' },
    { scene: 'double', target: 'bracket', title: 'Double Elimination', text: 'This is the bracket as Print EQ Sheets prints it. Nobody is out after one loss: everyone plays at least twice.' },
    { scene: 'double', target: 'bracket', part: function (box) { return box.querySelectorAll('.eqb-block')[0]; }, title: 'The Main Draw', text: 'Everyone starts here. Winners move right; a first loss drops a player down to the Survivor Trail, into the slot marked "Loser of …".' },
    { scene: 'double', target: 'bracket', part: function (box) { return box.querySelectorAll('.eqb-block')[1]; }, title: 'The Survivor Trail', text: 'One life left: a loss here ends the day. Main Draw losers keep dropping in round by round, so the Trail has more rounds than the Main Draw.' },
    { scene: 'double', target: 'bracket', part: function (box) { return box.querySelector('[data-eqb-match="GF"]'); }, title: 'The Final', text: 'The Main Draw winner plays the Survivor Trail winner. If the Survivor Trail winner wins, a best-of-3 Final replay decides it, since both then have one loss.' },
    { scene: 'doubles', target: 'teams', title: 'Doubles teams', text: 'Partners are drawn at random. A team plays at the average of its ratings, and the head start compares the two teams’ averages. Both partners gain or give the 8.' },
    { scene: 'doubles', target: 'odd', title: 'An odd number', text: 'The desk asks: someone sits out (picked, or drawn at random; they play Open Play), or one team of three. Or add someone to fill in before the first result.' },
    { scene: 'doubles', target: 'three', title: 'A team of three', text: 'They play at the average of all three. The team picks who sits out the first game; then whoever sat out comes in for whoever has played longest, so nobody sits out twice in a row.' },
    { scene: 'scoring', target: 'balls', title: 'Scoring', text: 'Tap the winner’s balls; the other side fills with 0 until you change it. A finished match turns green and shows the Winner.' },
    { scene: 'scoring', target: 'cut', title: 'Cut short, or a forfeit', text: 'A best-of-5 match cut to best of 3: tap the winner’s 2 ball, then Winner. If a player has to leave, choose who forfeited: no score needed, and no rating points move.' },
    { scene: 'scoring', target: 'champion', title: 'Finishing', text: 'When the last match is in, the desk shows the winner and everyone’s place. Check it, then Finalize Equalizer: each player gains or gives 8 a match.' },
    { scene: 'print', target: 'group-sheet', title: 'Group sheets', text: 'One per group, like the round robin sheet, with each match’s head start where that sheet shows rating adjustments.' },
    { scene: 'print', target: 'finals-sheet', title: 'Bracket sheets', text: 'Landscape brackets in the same style. Undecided slots say where they come from ("Winner of W1-2"); print again later and the names and results so far are filled in.' },
    { scene: 'night', target: 'times', title: 'How long it takes', text: 'A rough playing time for common turnouts. Best of 5 takes longer; the desk’s summary line shows the estimate for the actual draw.' },
    { scene: 'night', target: 'rules', title: 'Good to know', text: 'That’s the Equalizer. Open this guide again any time with the ? button while the desk is on the Equalizer.' }
  ];

  // ---- The guide window ----
  var guide = document.createElement('div');
  guide.className = 'eqg';
  guide.hidden = true;
  guide.innerHTML = '<div class="eqg-window" role="dialog" aria-modal="true" aria-labelledby="eqg-title">' +
    '<header class="eqg-head"><div><h2 id="eqg-title">The Equalizer</h2><p>How it works and what to expect · made-up players, nothing is saved</p></div><button type="button" class="eqg-x" data-eqg-close aria-label="Close the guide" title="Close">&times;</button></header>' +
    '<nav class="eqg-chapters" aria-label="Chapters">' + CHAPTERS.map(function (c) { return '<button type="button" data-eqg-chapter="' + c.id + '">' + esc(c.title) + '</button>'; }).join('') + '</nav>' +
    '<div class="eqg-stage"><div class="eqg-scene"></div><div class="eqg-spot" hidden></div></div>' +
    '<section class="eqg-callout" aria-live="polite"><h2></h2><p></p><footer><span class="eqg-progress"></span><button type="button" class="eqg-back">Back</button><button type="button" class="eqg-next">Next</button></footer></section>' +
  '</div>';
  document.body.appendChild(guide);
  var win = guide.querySelector('.eqg-window');
  var stage = guide.querySelector('.eqg-stage');
  var sceneBox = guide.querySelector('.eqg-scene');
  var spot = guide.querySelector('.eqg-spot');
  var callout = guide.querySelector('.eqg-callout');
  var stepIndex = 0;
  var shownScene = '';
  var opener = null;
  var frame = 0;

  function target() {
    var step = STEPS[stepIndex];
    var box = sceneBox.querySelector('[data-g="' + step.target + '"]');
    return box && step.part ? step.part(box) || box : box;
  }
  function place() {
    if (guide.hidden) return;
    var el = target();
    var stageRect = stage.getBoundingClientRect();
    var winRect = win.getBoundingClientRect();
    var rect = el && el.getBoundingClientRect();
    if (!rect || !rect.width) { spot.hidden = true; return; }
    spot.hidden = false;
    spot.style.left = (rect.left - stageRect.left + stage.scrollLeft - 6) + 'px';
    spot.style.top = (rect.top - stageRect.top + stage.scrollTop - 6) + 'px';
    spot.style.width = (rect.width + 12) + 'px';
    spot.style.height = (rect.height + 12) + 'px';
    if (window.innerWidth <= 640) return;
    // The callout goes below the spotlight, else above it, else beside it, inside the window.
    var cw = callout.offsetWidth;
    var ch = callout.offsetHeight;
    var top = rect.bottom - winRect.top + 16;
    if (top + ch > winRect.height - 12) top = rect.top - winRect.top - ch - 16;
    var left = Math.max(12, Math.min(winRect.width - cw - 12, rect.left - winRect.left));
    if (top < stageRect.top - winRect.top + 8) {
      top = Math.max(stageRect.top - winRect.top + 12, Math.min(winRect.height - ch - 12, rect.top - winRect.top));
      left = rect.right - winRect.left + 16 + cw < winRect.width ? rect.right - winRect.left + 16 : Math.max(12, rect.left - winRect.left - cw - 16);
    }
    callout.style.left = left + 'px';
    callout.style.top = top + 'px';
  }
  function showStep() {
    var step = STEPS[stepIndex];
    if (shownScene !== step.scene) {
      var scene = scenes[step.scene]();
      sceneBox.replaceChildren();
      if (typeof scene === 'string') sceneBox.innerHTML = scene; else sceneBox.appendChild(scene);
      shownScene = step.scene;
      fitSheets(sceneBox);
      stage.scrollTop = 0;
    }
    guide.querySelectorAll('[data-eqg-chapter]').forEach(function (button) {
      var current = button.getAttribute('data-eqg-chapter') === step.scene;
      button.setAttribute('aria-current', String(current));
      if (current && button.scrollIntoView) button.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
    callout.querySelector('h2').textContent = step.title;
    callout.querySelector('p').textContent = step.text;
    callout.querySelector('.eqg-progress').textContent = 'Step ' + (stepIndex + 1) + ' of ' + STEPS.length;
    callout.querySelector('.eqg-back').hidden = stepIndex === 0;
    callout.querySelector('.eqg-next').textContent = stepIndex === STEPS.length - 1 ? 'Finish' : 'Next';
    var el = target();
    if (el && el.scrollIntoView) {
      var r = el.getBoundingClientRect();
      var s = stage.getBoundingClientRect();
      // On a phone the callout sits at the bottom, so the spotlight goes to the top.
      var phone = window.innerWidth <= 640;
      if (r.top < s.top + 8 || r.bottom > s.bottom - (phone ? 260 : 220)) el.scrollIntoView({ block: phone ? 'start' : 'center' });
    }
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(place);
  }
  function openGuide(atScene) {
    opener = document.activeElement;
    closeTeaser();
    stepIndex = 0;
    if (atScene) STEPS.some(function (step, i) { if (step.scene === atScene) { stepIndex = i; return true; } return false; });
    shownScene = '';
    guide.hidden = false;
    document.body.classList.add('tour-active');
    showStep();
    callout.querySelector('.eqg-next').focus();
  }
  function closeGuide() {
    if (guide.hidden) return;
    guide.hidden = true;
    document.body.classList.remove('tour-active');
    sceneBox.replaceChildren();
    shownScene = '';
    if (opener && opener.focus) opener.focus();
  }
  guide.addEventListener('click', function (e) {
    if (e.target.closest('[data-eqg-close]') || e.target === guide) { closeGuide(); return; }
    var chapter = e.target.closest('[data-eqg-chapter]');
    if (chapter) { STEPS.some(function (step, i) { if (step.scene === chapter.getAttribute('data-eqg-chapter')) { stepIndex = i; return true; } return false; }); showStep(); return; }
    if (e.target.closest('.eqg-back') && stepIndex > 0) { stepIndex -= 1; showStep(); return; }
    if (e.target.closest('.eqg-next')) { if (stepIndex === STEPS.length - 1) closeGuide(); else { stepIndex += 1; showStep(); } }
  });
  guide.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); closeGuide(); }
    else if (e.key === 'ArrowRight' && e.target.tagName !== 'SELECT') { e.preventDefault(); if (stepIndex < STEPS.length - 1) { stepIndex += 1; showStep(); } }
    else if (e.key === 'ArrowLeft' && e.target.tagName !== 'SELECT') { e.preventDefault(); if (stepIndex > 0) { stepIndex -= 1; showStep(); } }
    else if (e.key === 'Tab') {
      var buttons = Array.from(guide.querySelectorAll('button:not([hidden]):not([tabindex="-1"])'));
      var at = buttons.indexOf(document.activeElement);
      if (e.shiftKey && at <= 0) { e.preventDefault(); buttons[buttons.length - 1].focus(); }
      else if (!e.shiftKey && at === buttons.length - 1) { e.preventDefault(); buttons[0].focus(); }
    }
  });
  stage.addEventListener('scroll', function () { cancelAnimationFrame(frame); frame = requestAnimationFrame(place); });
  window.addEventListener('resize', function () { if (!guide.hidden) { fitSheets(sceneBox); place(); } });

  // ---- The teaser: under the switch whenever the Equalizer is chosen, until it is turned off on this device ----
  var teaser = document.createElement('section');
  teaser.className = 'eqg-teaser';
  teaser.hidden = true;
  teaser.setAttribute('role', 'dialog');
  teaser.setAttribute('aria-labelledby', 'eqg-teaser-title');
  teaser.innerHTML = '<button type="button" class="eqg-x" data-teaser-close aria-label="Close" title="Close">&times;</button>' +
    '<h2 id="eqg-teaser-title"><span class="eqg-tag">New</span>The Equalizer</h2>' +
    '<p>Same players, a new way to play: the lower-rated player starts every game with a head start (1 point per 40 rating points, up to 8), and every match is worth 8 rating points.</p>' +
    '<p>Choose RR → Finals or Double Elimination, singles or doubles, and best of 3 or 5 in the toolbar.</p>' +
    '<footer><label><input type="checkbox" data-teaser-off> Don’t show this again</label><button type="button" class="secondary" data-teaser-close>Got it</button><button type="button" class="primary" data-teaser-guide>How it works</button></footer>';
  document.body.appendChild(teaser);
  function teaserOff() { try { return localStorage.getItem(TEASER_OFF) === '1'; } catch (error) { return false; } }
  function placeTeaser() {
    if (teaser.hidden) return;
    var rect = switcher.getBoundingClientRect();
    var width = teaser.offsetWidth;
    teaser.style.left = Math.max(12, Math.min(window.innerWidth - width - 12, rect.left)) + 'px';
    teaser.style.top = Math.max(12, rect.bottom + 10) + 'px';
  }
  function showTeaser() {
    if (teaserOff()) return;
    teaser.querySelector('[data-teaser-off]').checked = false;
    teaser.hidden = false;
    placeTeaser();
  }
  function closeTeaser() {
    if (teaser.hidden) return;
    teaser.hidden = true;
    if (teaser.querySelector('[data-teaser-off]').checked) { try { localStorage.setItem(TEASER_OFF, '1'); } catch (error) { /* shows again next time */ } }
  }
  teaser.addEventListener('click', function (e) {
    if (e.target.closest('[data-teaser-close]')) closeTeaser();
    else if (e.target.closest('[data-teaser-guide]')) { closeTeaser(); openGuide(); }
  });
  teaser.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeTeaser(); });
  window.addEventListener('resize', placeTeaser);
  window.addEventListener('scroll', placeTeaser, true);
  // After the switch has done its work: on the Equalizer, the teaser; back on the round robin, it goes.
  switcher.addEventListener('click', function (e) {
    var button = e.target.closest('[data-event]');
    if (!button) return;
    setTimeout(function () {
      if (button.getAttribute('data-event') === 'equalizer' && window.cttcDesk.event().short === 'EQ') showTeaser();
      else closeTeaser();
    }, 0);
  });
  // The ? button opens this guide while the desk is on the Equalizer, and the desk tour otherwise.
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('#show-tour') || window.cttcDesk.event().short !== 'EQ') return;
    e.preventDefault();
    e.stopPropagation();
    openGuide();
  }, true);
  launcher.title = 'Show me how this all works (on an Equalizer night: how the Equalizer works)';

  window.cttcEqualizerGuide = { open: openGuide, close: closeGuide, steps: STEPS, chapters: CHAPTERS, teaser: showTeaser };
})();
</script>
