<style id="rr-print-style">
.print-root{display:none}
.print-root.previewing{display:block;position:fixed;inset:0;z-index:100;overflow:auto;padding:0 16px 32px;background:#d8ddda}
.print-preview-toolbar{position:sticky;top:0;z-index:1;display:flex;justify-content:flex-end;gap:8px;padding:12px 0;background:#d8ddda}
.print-preview-toolbar button{padding:8px 16px;border:1px solid #176b45;border-radius:3px;background:#fff;color:#176b45;font:16px Arial,sans-serif;cursor:pointer}
.print-preview-toolbar button:last-child{background:#176b45;color:#fff}
.print-preview-warning{margin-right:auto;align-self:center;color:#7a2b10;font:14px Arial,sans-serif}
.print-root .print-sheet{margin:0 auto 20px}
.print-sheet {
  box-sizing: border-box;
  width: min(8.5in, 100%);
  min-height: 11in;
  padding: 0.4in 0.46in;
  background: #fff;
  box-shadow: 0 12px 32px rgba(37, 34, 29, 0.18);
  color: #111;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 10pt;
}
.print-tournament-sheet {
  padding: 0.52in 1in 0.45in 0.36in;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 8.5pt;
}
.tournament-sheet-columns {
  display: grid;
  grid-template-columns: minmax(0, 52fr) minmax(0, 48fr);
  gap: 0.28in;
  align-items: start;
}
.tournament-metadata {
  display: flex;
  flex-direction: column;
  gap: 0.1in;
  margin: 0.05in 0 0.22in;
  font-size: 10pt;
}
.tournament-player-register {
  border: 0;
}
.tournament-player-key {
  min-height: 0.18in;
  border-bottom: 1px solid #777;
  padding: 5px 4px 3px;
  font-size: 6.2pt;
  line-height: 1.15;
}
.tournament-player-row {
  position: relative;
  display: flex;
  align-items: flex-start;
  min-height: 0.52in;
  border-inline: 1px solid #777;
  border-bottom: 1px solid #777;
  padding: 5px 3px;
  font-size: 9pt;
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.tournament-player-row::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0.14in;
  left: 0;
  border-top: 1px solid #777;
}
.tournament-instructions {
  display: flex;
  flex-direction: column;
  gap: 0.15in;
  margin: 0.55in 0 0;
  padding: 0;
  list-style: none;
  font-size: 10.5pt;
  line-height: 1.18;
}
.tournament-instructions li {
  display: grid;
  grid-template-columns: 0.17in minmax(0, 1fr);
  gap: 0.12in;
  align-items: start;
}
.tournament-checkbox {
  box-sizing: border-box;
  width: 0.17in;
  height: 0.17in;
  border: 1px solid #444;
  margin-top: 1px;
}
.tournament-brand {
  display: grid;
  grid-template-columns: 0.62in minmax(0, 1fr);
  align-items: center;
  gap: 0.16in;
  min-height: 0.72in;
  margin-bottom: 0;
  margin-left: -0.85in;
}
.tournament-brand img {
  width: 0.62in;
  height: 0.72in;
  object-fit: contain;
  filter: grayscale(1) contrast(1.2);
}
.tournament-brand > div {
  display: flex;
  flex-direction: column;
  width: max-content;
  max-width: 100%;
  gap: 1px;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  line-height: 1.1;
  text-align: center;
}
.tournament-brand span {
  font-size: 12pt;
}
.tournament-brand strong {
  font-size: 11pt;
  font-weight: normal;
}
.tournament-schedule {
  margin-top: -0.125in;
}
.tournament-schedule-heading {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 0.86in;
  align-items: end;
  gap: 0.08in;
  margin-top: 0;
  margin-bottom: 0.1in;
}
.tournament-schedule-heading strong {
  border-bottom: 1px solid #111;
  font-size: 11pt;
  line-height: 1.1;
}
.tournament-schedule-heading span {
  font-size: 6.5pt;
  font-style: italic;
  line-height: 1.05;
}
.tournament-matches {
  display: flex;
  flex-direction: column;
  gap: 0.05in;
}
.tournament-match {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 0.48in 0.78in;
  gap: 0;
  min-height: 0.39in;
}
.tournament-match-names,
.tournament-match-result {
  display: grid;
  grid-template-rows: repeat(2, minmax(0, 1fr));
}
.tournament-match-names span,
.tournament-match-result span {
  display: flex;
  align-items: center;
  min-width: 0;
  border-bottom: 1px solid #777;
}
.tournament-match-names span {
  padding: 0 2px;
  font-size: 7pt;
  line-height: 1;
  overflow-wrap: anywhere;
}
.tournament-match-names {
  border-top: 1px solid #777;
}
.tournament-match-result {
  border-inline: 1px solid #777;
  border-top: 1px solid #777;
}
.tournament-match-result span {
  justify-content: center;
  font-size: 12pt;
  font-weight: 600;
}
.tournament-rating-adjustment {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  font-size: 6.5pt;
}
@media print {
  @page { size: letter portrait; margin: 0 }
  body.printing > *:not(.print-root) { display: none !important }
  body.printing { background: #fff }
  body.printing .print-root { display: block; position:static;overflow:visible;padding:0;background:#fff }
  .print-preview-toolbar { display:none }
  .print-root .print-sheet { width: 8.5in; min-height: 11in; margin: 0; box-shadow: none; break-after: page; page-break-after: always }
  .print-sheet:last-child { break-after: auto; page-break-after: auto }
}
</style>
<div id="print-root" class="print-root"></div>
<script>
(function () {
  var O = window.CTTCOrganizer;
  var root = document.getElementById('print-root');
  var INSTRUCTIONS = [
    'No pre-match warm-ups! All warm-ups must be done before the start of the competition.',
    'Play each opponent a best-of-five 11-point-game match.',
    'Record games won lost.',
    'Winners are responsible for recording match results.',
    'The table winner advances to a higher table the next week',
    'Put your table away after completion of the last match.'
  ];
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }
  function longDate(value) {
    return new Date(value + 'T12:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }
  function tournamentSheets(desk, records) {
    return desk.groups.map(function (group) {
      var sheet = el('article', 'print-sheet print-score-sheet print-tournament-sheet');
      var columns = el('div', 'tournament-sheet-columns');
      var left = el('div', 'tournament-sheet-left');
      var meta = el('div', 'tournament-metadata');
      meta.append(el('span', '', 'Date:  ' + longDate(desk.date)), el('span', '', 'Table #  ' + group.groupNumber));
      var register = el('section', 'tournament-player-register');
      register.appendChild(el('div', 'tournament-player-key', 'Player [Club Rating] (Club Record) (' + desk.date.slice(0, 4) + ' Record)'));
      group.playerIds.forEach(function (id) {
        var p = desk.player(id);
        var record = records[id];
        var club = record ? record.clubWins + '/' + record.clubLosses : '--/--';
        var year = record ? record.yearWins + '/' + record.yearLosses : '--/--';
        register.appendChild(el('div', 'tournament-player-row', p.name + ' [' + p.currentRating + '] (' + club + ') (' + year + ')'));
      });
      var list = el('ul', 'tournament-instructions');
      INSTRUCTIONS.forEach(function (text) {
        var item = el('li');
        item.append(el('span', 'tournament-checkbox'), el('span', '', text));
        list.appendChild(item);
      });
      left.append(meta, register, list);

      var right = el('div', 'tournament-sheet-right');
      var brand = el('div', 'tournament-brand');
      var logo = el('img');
      logo.src = 'https://concordtabletennisclub.com/assets/logo-transparent.png';
      logo.alt = '';
      var name = el('div');
      name.append(el('span', '', 'Concord Table Tennis Club'), el('strong', '', 'Tournament Sheet'));
      brand.append(logo, name);
      var schedule = el('section', 'tournament-schedule');
      var heading = el('div', 'tournament-schedule-heading');
      var adj = el('span');
      adj.append('Rating Adj.', el('br'), 'Expected/Upset');
      heading.append(el('strong', '', 'Match Schedules/Results'), adj);
      var rows = el('div', 'tournament-matches');
      desk.matches.filter(function (m) { return m.groupNumber === group.groupNumber; }).forEach(function (m) {
        var match = el('div', 'tournament-match');
        var names = el('div', 'tournament-match-names');
        names.append(el('span', '', desk.player(m.playerOneId).name), el('span', '', desk.player(m.playerTwoId).name));
        var result = el('div', 'tournament-match-result');
        result.append(el('span', '', m.playerOneGames == null ? '' : String(m.playerOneGames)), el('span', '', m.playerTwoGames == null ? '' : String(m.playerTwoGames)));
        match.append(names, result, el('span', 'tournament-rating-adjustment', O.sheetAdjustment(desk.player(m.playerOneId).currentRating, desk.player(m.playerTwoId).currentRating)));
        rows.appendChild(match);
      });
      schedule.append(heading, rows);
      right.append(brand, schedule);
      columns.append(left, right);
      sheet.appendChild(columns);
      return sheet;
    });
  }
  async function print() {
    var desk = window.cttcDesk.print();
    if (!desk.groups.length) return;
    if (window.cttcDesk.needsPrintSave() && confirm('Save draft changes before printing RR sheets?')) {
      if (!await window.cttcDesk.saveDraft()) return;
    }
    var ids = desk.groups.reduce(function (all, group) { return all.concat(group.playerIds); }, []);
    var result;
    try {
      result = await window.cttcRequest('getPlayerRecordsForPrint', ids, desk.date);
    } catch (error) {
      document.getElementById('status').textContent = 'RR records unavailable: ' + (error.message || String(error));
      return;
    }
    var toolbar = el('div', 'print-preview-toolbar');
    var close = el('button', '', 'Close preview');
    var printButton = el('button', '', 'Print');
    close.type = printButton.type = 'button';
    close.addEventListener('click', function () {
      root.classList.remove('previewing');
      root.replaceChildren();
      document.body.classList.remove('printing');
      document.getElementById('print-sheets').focus();
    });
    printButton.addEventListener('click', function () { window.print(); });
    if (result.missing) toolbar.appendChild(el('span', 'print-preview-warning', result.missing + ' player record(s) unavailable in the archive.'));
    toolbar.append(close, printButton);
    root.replaceChildren.apply(root, [toolbar].concat(tournamentSheets(desk, result.records)));
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-label', 'RR sheet preview');
    root.setAttribute('aria-modal', 'true');
    document.body.classList.add('printing');
    root.classList.add('previewing');
    close.focus();
  }
  root.addEventListener('keydown', function (event) {
    if (!root.classList.contains('previewing')) return;
    var buttons = root.querySelectorAll('.print-preview-toolbar button');
    if (event.key === 'Escape') {
      event.preventDefault();
      buttons[0].click();
    } else if (event.key === 'Tab' && (event.shiftKey ? document.activeElement === buttons[0] : document.activeElement === buttons[1])) {
      event.preventDefault();
      buttons[event.shiftKey ? 1 : 0].focus();
    }
  });
  document.getElementById('print-sheets').addEventListener('click', print);
})();
</script>
