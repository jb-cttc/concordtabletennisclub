<script>
(function (root, factory) {
  "use strict";

  var api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  if (root) root.CTTCStandings = api;
}(typeof window !== "undefined" ? window : globalThis, function () {
  "use strict";

  // USATT Rule Interpretations 6.3: a win is 2 match points, a played loss 1, a forfeited or
  // unplayed match 0 for the loser. The forfeit winner gets 2 and a 3-0 game score for tie-breaks.
  // Ties: two players use their head-to-head result; three or more use the game ratio among the
  // tied players (CTTC rule). Anything still level goes to the lowest pre-session rating.
  var FORFEIT_GAMES = 3;

  function isNumber(value) {
    return typeof value === "number" && isFinite(value);
  }

  function isScored(match) {
    return (match.gamesWon || 0) > 0 || (match.gamesLost || 0) > 0;
  }

  // A 0-0 match is a forfeit. forfeitedBy names the player who forfeited; "both" (or no name,
  // as in the scraped Access reports) means neither player played.
  function outcome(player, match) {
    if (isScored(match)) {
      var won = match.gamesWon > match.gamesLost;
      return { kind: won ? "win" : "loss", points: won ? 2 : 1, gamesWon: match.gamesWon || 0, gamesLost: match.gamesLost || 0 };
    }
    var by = match.forfeitedBy;
    if (by && by !== "both") {
      return by === player.name
        ? { kind: "forfeit-loss", points: 0, gamesWon: 0, gamesLost: FORFEIT_GAMES }
        : { kind: "forfeit-win", points: 2, gamesWon: FORFEIT_GAMES, gamesLost: 0 };
    }
    return { kind: "double-forfeit", points: 0, gamesWon: 0, gamesLost: 0 };
  }

  function tally(player) {
    var t = { wins: 0, losses: 0, forfeitLosses: 0, doubleForfeits: 0, points: 0 };
    if (Array.isArray(player.matches) && player.matches.length) {
      player.matches.forEach(function (match) {
        var result = outcome(player, match);
        t.points += result.points;
        if (result.kind === "win" || result.kind === "forfeit-win") t.wins += 1;
        else if (result.kind === "loss") t.losses += 1;
        else if (result.kind === "forfeit-loss") t.forfeitLosses += 1;
        else t.doubleForfeits += 1;
      });
    } else if (isNumber(player.wins) && isNumber(player.losses)) {
      t.wins = player.wins;
      t.losses = player.losses;
      t.points = player.wins * 2 + player.losses;
    }
    return t;
  }

  function findMatch(player, opponentName) {
    var matches = player.matches || [];
    for (var i = 0; i < matches.length; i++) {
      if (matches[i].opponent === opponentName) return matches[i];
    }
    return null;
  }

  function ratingOrInfinity(player) {
    return isNumber(player.ratingBefore) ? player.ratingBefore : Infinity;
  }

  function lowestRatingFirst(a, b) {
    var left = ratingOrInfinity(a);
    var right = ratingOrInfinity(b);
    if (left !== right) return left < right ? -1 : 1;
    return String(a.name).localeCompare(String(b.name));
  }

  function headToHead(a, b) {
    var match = findMatch(a, b.name);
    if (match) {
      var result = outcome(a, match);
      if (result.kind === "win" || result.kind === "forfeit-win") {
        return { winner: a, loser: b, forfeit: result.kind === "forfeit-win", gamesWon: result.gamesWon, gamesLost: result.gamesLost };
      }
      if (result.kind === "loss" || result.kind === "forfeit-loss") {
        return { winner: b, loser: a, forfeit: result.kind === "forfeit-loss", gamesWon: result.gamesLost, gamesLost: result.gamesWon };
      }
      return null;
    }
    var reverse = findMatch(b, a.name);
    return reverse ? headToHead(b, a) : null;
  }

  function resolvePair(a, b) {
    var result = headToHead(a, b);
    if (result) {
      return { how: result.forfeit ? "forfeit" : "head-to-head", ordered: [result.winner, result.loser], detail: result };
    }
    // No decisive match (double forfeit): same rule as a larger tie, game ratio then lowest rating.
    return resolveMany([a, b]);
  }

  function gameRatio(won, lost) {
    if (lost === 0) return won > 0 ? Infinity : 0;
    return won / lost;
  }

  function resolveMany(tied) {
    var stats = tied.map(function (player) {
      var won = 0;
      var lost = 0;
      (player.matches || []).forEach(function (match) {
        var opponentIsTied = tied.some(function (other) { return other.name === match.opponent; });
        if (!opponentIsTied) return;
        var result = outcome(player, match);
        won += result.gamesWon;
        lost += result.gamesLost;
      });
      return { player: player, gamesWon: won, gamesLost: lost, ratio: gameRatio(won, lost) };
    });
    stats.sort(function (a, b) {
      if (a.ratio !== b.ratio) return a.ratio > b.ratio ? -1 : 1;
      return lowestRatingFirst(a.player, b.player);
    });
    return {
      how: stats[0].ratio === stats[1].ratio ? "rating" : "game-ratio",
      ordered: stats.map(function (item) { return item.player; }),
      stats: stats
    };
  }

  function analyze(players) {
    if (players.length && players.every(function (player) { return player.matchesUnavailable; })) {
      var summaryOnly = players.map(function (player, index) { return { player: player, index: index }; });
      summaryOnly.sort(function (a, b) {
        var left = a.player.ratingAfter;
        var right = b.player.ratingAfter;
        if (!isNumber(left) && !isNumber(right)) return a.index - b.index;
        if (!isNumber(left)) return 1;
        if (!isNumber(right)) return -1;
        return right - left || a.index - b.index;
      });
      return { order: summaryOnly.map(function (item) { return item.player; }), ties: [] };
    }

    var entries = players.map(function (player, index) {
      return { player: player, points: tally(player).points, index: index };
    });
    entries.sort(function (a, b) { return b.points - a.points || a.index - b.index; });

    var order = [];
    var ties = [];
    var i = 0;
    while (i < entries.length) {
      var j = i + 1;
      while (j < entries.length && entries[j].points === entries[i].points) j++;
      var level = entries.slice(i, j).map(function (entry) { return entry.player; });
      if (level.length === 1) {
        order.push(level[0]);
      } else {
        var tie = level.length === 2 ? resolvePair(level[0], level[1]) : resolveMany(level);
        tie.points = entries[i].points;
        ties.push(tie);
        order = order.concat(tie.ordered);
      }
      i = j;
    }
    return { order: order, ties: ties };
  }

  function sortByGroupResult(players) {
    return analyze(players).order;
  }

  function plural(count, singular, pluralForm) {
    return count + " " + (count === 1 ? singular : (pluralForm || singular + "s"));
  }

  function recordText(player) {
    var t = tally(player);
    var parts = [plural(t.wins, "win")];
    if (t.losses) parts.push(plural(t.losses, "loss", "losses"));
    return parts.join(", ");
  }

  function ratingText(player) {
    return isNumber(player.ratingBefore) ? String(player.ratingBefore) : "unrated";
  }

  function tieText(tie) {
    var winner = tie.ordered[0];
    if (tie.ordered.length === 2) {
      var loser = tie.ordered[1];
      if (tie.how === "head-to-head") {
        return winner.name + " beat " + loser.name + " " + tie.detail.gamesWon + "-" + tie.detail.gamesLost + " head-to-head";
      }
      if (tie.how === "forfeit") return winner.name + " beat " + loser.name + " by forfeit";
      return "no head-to-head, lower rating wins (" +
        winner.name + " " + ratingText(winner) + " vs " + loser.name + " " + ratingText(loser) + ")";
    }
    var list = tie.stats.map(function (item) {
      return item.player.name + " " + item.gamesWon + "/" + item.gamesLost;
    }).join(", ");
    if (tie.how === "game-ratio") return "game ratio among the tied (" + list + ")";
    return "game ratios level (" + list + "), lowest rating wins: " + winner.name + " " + ratingText(winner);
  }

  // Explains the first-place finish when it needed more than the win count: same wins with different
  // match points, or a tie on match points. Returns null when the winner was clear.
  function describeWinner(players) {
    if (!players.length || players.every(function (player) { return player.matchesUnavailable; })) return null;
    var result = analyze(players);
    var winner = result.order[0];
    var winnerTally = tally(winner);
    var tie = null;
    result.ties.forEach(function (candidate) {
      if (candidate.ordered[0] === winner) tie = candidate;
    });
    var rivals = result.order.slice(1).filter(function (player) {
      var t = tally(player);
      return t.wins === winnerTally.wins && t.points < winnerTally.points;
    });
    if (!tie && !rivals.length) return null;

    var parts = [];
    if (rivals.length) {
      parts.push(winner.name + " highest USATT match-point total, " + plural(winnerTally.points, "pt") + " (" + recordText(winner) + ")");
    }
    if (tie) parts.push(tieText(tie));
    return { winner: winner.name, text: "Tie-breaker: " + parts.join("; ") };
  }

  return {
    sortByGroupResult: sortByGroupResult,
    describeWinner: describeWinner,
    tally: tally
  };
}));
</script>
