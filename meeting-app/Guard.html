<script>
// ALLOWALL framing lets any site embed this signed-in app, so only the club site (or localhost for testing) may; anyone
// else gets an opaque cover. The same rule as the desk (apps-script/Index.html).
(function () {
  var ancestors = window.location.ancestorOrigins ? Array.prototype.slice.call(window.location.ancestorOrigins) : null;
  var sandbox = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
  var trusted = /^(https:\/\/concordtabletennisclub\.com|http:\/\/(localhost|127\.0\.0\.1):\d+)$/;
  var direct = !!ancestors && ancestors.length === 2 && sandbox.test(ancestors[0]) && ancestors[1] === 'https://script.google.com';
  var embedded = !!ancestors && ancestors.length === 3 && sandbox.test(ancestors[0]) && ancestors[1] === 'https://script.google.com' && trusted.test(ancestors[2]);
  window.cttcEmbedded = embedded;
  // Framed by the club site: tell meeting.html the app opened, so it does not show its sign-in help.
  if (embedded) { try { window.top.postMessage({ cttcMeeting: 'ready' }, ancestors[2]); } catch (error) { /* the site keeps its help */ } }
  if (!ancestors || direct || embedded) return;
  var cover = document.createElement('div');
  cover.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483647;background:#fff;color:#17211b;font:16px Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px';
  cover.textContent = 'The CTTC meeting app can only be opened directly or from the club website.';
  document.body.appendChild(cover);
})();
</script>
