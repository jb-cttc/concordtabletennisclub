<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan to Pay - Concord Table Tennis Club</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css?v=20261122">
  <!-- The front desk sign: print this page. Its QR code (assets/pay-qr.svg) opens pay.html. scripts/sync-nav.js leaves it alone. -->
  <link rel="icon" href="assets/logo.png" type="image/png">
  <meta name="theme-color" content="#FAF8F3">
</head>
<body>

<main class="pay-sign">
  <h1>Scan to pay</h1>
  <img class="pay-sign-qr" src="assets/pay-qr.svg" alt="QR code that opens concordtabletennisclub.com/pay.html">
  <p class="pay-sign-ways">Venmo &middot; Zelle &middot; Card</p>
  <p class="pay-sign-url">concordtabletennisclub.com/pay.html</p>
  <p class="pay-sign-print"><button type="button" class="button-link" onclick="window.print()">Print this sign</button></p>
</main>

</body>
</html>
