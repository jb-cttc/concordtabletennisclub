name: Desk log

# Prints the round-robin desk's CTTC Desk Logs tab: problems, missed steps and the latest lines. Read-only. The log
# holds no names, addresses, numbers or payment details, because run logs here are public.
on:
  workflow_dispatch:
    inputs:
      lines:
        description: "How many of the latest lines to show"
        default: "150"
      session:
        description: "Only this session (YYYY-MM-DD), or blank for all"
        default: ""
      ref:
        description: "Only this Reference (from a desk error message), or blank"
        default: ""

permissions:
  contents: read

jobs:
  desk-log:
    if: ${{ vars.CTTC_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24

      - name: Print the desk log
        run: node scripts/desk-log.js --lines "$LINES" --session "$SESSION" --ref "$REF"
        env:
          LINES: ${{ github.event.inputs.lines }}
          SESSION: ${{ github.event.inputs.session }}
          REF: ${{ github.event.inputs.ref }}
          GOOGLE_ROUND_ROBIN_DATABASE_ID: ${{ secrets.GOOGLE_ROUND_ROBIN_DATABASE_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
