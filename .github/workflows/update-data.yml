name: Update Data and Deploy

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Full hard refresh: refetch and reparse every session (ignores the raw data cache)"
        type: boolean
        default: false
      send_email:
        description: "Also send the session summary email (the desk sets this 15 minutes after the site is published)"
        type: boolean
        default: false
  schedule:
    # Normally the desk starts this workflow itself: 15 minutes after a session is
    # finalized (publish only), then again 15 minutes after the site lists it with
    # send_email=true (the results email). Pushes and plain manual runs never email.
    # These scheduled runs publish and email, and are the fallback for when
    # that does not happen (no GitHub token, desk tab closed, late entry): 11:45 PM
    # Pacific after Monday and Wednesday sessions (later than any 15-minute hold that
    # started by 11:30 PM), and 8:00 AM Pacific the next morning. A run that finds
    # nothing new is a safe no-op (send-session-email.js has its own already-sent
    # guard), so these never double-send.
    #
    # GitHub Actions cron doesn't support timezones, so both possible UTC
    # offsets are scheduled for each slot (PDT and PST).
    #
    # There's deliberately no "is it actually the right Pacific hour"
    # gate here anymore: GitHub can delay a scheduled trigger by hours
    # during high load, and a strict hour check used to skip those late
    # firings entirely, silently dropping a whole session's update (this
    # is what happened to the Wednesday 2026-08-26 session). Every firing
    # now just runs — safe because fetching is a no-op when nothing's
    # new, and emailing is blocked by the already-sent marker.
    - cron: "45 6 * * 2,4"  # 11:45 PM PDT (UTC-7)
    - cron: "45 7 * * 2,4"  # 11:45 PM PST (UTC-8)
    - cron: "0 15 * * 2,4"  # 8:00 AM PDT (UTC-7)
    - cron: "0 16 * * 2,4"  # 8:00 AM PST (UTC-8)
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    # Runs only where CTTC_DEPLOY_ENABLED is set to true, so forks never deploy or email.
    if: ${{ vars.CTTC_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh session list
        if: ${{ vars.CTTC_LIVE_START_DATE == '' }}
        run: npm run build:sessions

      - name: Refresh parsed data
        if: ${{ vars.CTTC_LIVE_START_DATE == '' }}
        run: npm run build:data
        env:
          CTTC_FETCH_DELAY_MS: 250
          CTTC_FULL_REFRESH: ${{ github.event.inputs.full_refresh == 'true' }}

      - name: Publish finalized Google sessions
        if: ${{ vars.CTTC_LIVE_START_DATE != '' }}
        run: npm run publish:finalized
        env:
          CTTC_LIVE_START_DATE: ${{ vars.CTTC_LIVE_START_DATE }}
          GOOGLE_ROUND_ROBIN_DATABASE_ID: ${{ secrets.GOOGLE_ROUND_ROBIN_DATABASE_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}

      # Parallel operations: Access is still entered, so keep reading its reports for the admin-only
      # comparison (npm run compare:parallel). Nothing from this step is published to the site.
      - name: Scrape Access reports for comparison only
        if: ${{ vars.CTTC_LIVE_START_DATE != '' }}
        continue-on-error: true
        run: npm run build:sessions && npm run build:data
        env:
          CTTC_ACCESS_DIR: .cache/access-parallel
          CTTC_FETCH_DELAY_MS: 250

      - name: Refresh public indexes and verify data
        run: npm run build:roster && npm run build:player-index && npm run build:latest-email && npm run check:data

      - name: Commit generated data
        run: |
          FILES="data/sessions.json data/session-details-*.json data/players.json data/site-status.json data/session-roster.json data/player-index.json data/session-summaries.json data/latest-session-email.json data/parse-report.json .cache/session-raw-cache.json .cache/access-parallel/sessions.json"
          EXISTING=""
          for f in $FILES; do
            [ -e "$f" ] && EXISTING="$EXISTING $f"
          done
          if [ -n "$EXISTING" ] && [ -n "$(git status --porcelain $EXISTING)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $EXISTING
            git commit -m "Update session data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp .nojekyll CNAME _site/
          cp *.html style.css navtoggle.js standings.js favicon.svg _site/
          cp -R data _site/
          cp -R assets _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      - name: Send session summary email
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.send_email == 'true')
        run: npm run email:send
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_SUBSCRIBERS: ${{ secrets.EMAIL_SUBSCRIBERS }}
          GOOGLE_SHEETS_SUBSCRIBERS_ID: ${{ secrets.GOOGLE_ROUND_ROBIN_DATABASE_ID }}
          GOOGLE_SHEETS_SUBSCRIBERS_RANGE: Subscribers!A:A
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CTTC_LIVE_START_DATE: ${{ vars.CTTC_LIVE_START_DATE }}

      - name: Commit sent marker
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.send_email == 'true')
        run: |
          if [ -f .cache/last-emailed-session.json ] && [ -n "$(git status --porcelain .cache/last-emailed-session.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .cache/last-emailed-session.json
            git commit -m "Record emailed session"
            git push
          fi
