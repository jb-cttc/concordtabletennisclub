name: Update Data and Deploy

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Full hard refresh: refetch and reparse every session (ignores the raw data cache)"
        type: boolean
        default: false
  schedule:
    # Primary: 10:30 PM Pacific, after Monday and Wednesday sessions.
    # Fallback: 8:00 AM Pacific the next morning, in case results weren't
    # posted yet by 10:30 PM the night before (e.g. entered late) — a run
    # that finds nothing new is a safe no-op (fetching is incremental, and
    # send-session-email.js has its own already-sent guard), so this just
    # gives late data a second chance to go out without ever double-sending.
    #
    # GitHub Actions cron doesn't support timezones, so both possible UTC
    # offsets are scheduled for each slot (PDT and PST).
    #
    # There's deliberately no "is it actually the right Pacific hour"
    # gate here anymore: GitHub can delay a scheduled trigger by hours
    # during high load, and a strict hour check used to skip those late
    # firings entirely, silently dropping a whole session's update (this
    # is what happened to the Wednesday 2026-08-26 session). Every firing
    # now just runs — safe because fetching is a no-op when nothing's
    # new, and emailing is blocked by the already-sent marker.
    - cron: "30 5 * * 2,4"  # 10:30 PM PDT (UTC-7)
    - cron: "30 6 * * 2,4"  # 10:30 PM PST (UTC-8)
    - cron: "0 15 * * 2,4"  # 8:00 AM PDT (UTC-7)
    - cron: "0 16 * * 2,4"  # 8:00 AM PST (UTC-8)
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    # Runs only in the live repo, or where CTTC_DEPLOY_ENABLED is set (jb-cttc at domain cutover); never in forks.
    if: ${{ github.repository == 'Latkecrszy/concordtabletennisclub' || vars.CTTC_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh session list
        if: ${{ vars.CTTC_LIVE_START_DATE == '' }}
        run: npm run build:sessions

      - name: Refresh parsed data
        if: ${{ vars.CTTC_LIVE_START_DATE == '' }}
        run: npm run build:data
        env:
          CTTC_FETCH_DELAY_MS: 250
          CTTC_FULL_REFRESH: ${{ github.event.inputs.full_refresh == 'true' }}

      - name: Publish finalized Google sessions
        if: ${{ vars.CTTC_LIVE_START_DATE != '' }}
        run: npm run publish:finalized
        env:
          CTTC_LIVE_START_DATE: ${{ vars.CTTC_LIVE_START_DATE }}
          GOOGLE_ROUND_ROBIN_DATABASE_ID: ${{ secrets.GOOGLE_ROUND_ROBIN_DATABASE_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}

      - name: Refresh public indexes and verify data
        run: npm run build:roster && npm run build:player-index && npm run check:data

      - name: Commit generated data
        run: |
          FILES="data/sessions.json data/session-details-*.json data/players.json data/site-status.json data/session-roster.json data/player-index.json data/session-summaries.json data/parse-report.json .cache/session-raw-cache.json"
          EXISTING=""
          for f in $FILES; do
            [ -e "$f" ] && EXISTING="$EXISTING $f"
          done
          if [ -n "$EXISTING" ] && [ -n "$(git status --porcelain $EXISTING)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $EXISTING
            git commit -m "Update session data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp .nojekyll CNAME _site/
          cp *.html style.css navtoggle.js standings.js favicon.svg _site/
          cp -R data _site/
          cp -R assets _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      - name: Send session summary email
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run email:send
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_SUBSCRIBERS: ${{ secrets.EMAIL_SUBSCRIBERS }}
          GOOGLE_SHEETS_SUBSCRIBERS_ID: ${{ secrets.GOOGLE_SHEETS_SUBSCRIBERS_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_SHEETS_SUBSCRIBERS_RANGE: ${{ secrets.GOOGLE_SHEETS_SUBSCRIBERS_RANGE }}
          TEST_EMAIL_OVERRIDE: ${{ secrets.TEST_EMAIL_OVERRIDE }}
          CTTC_LIVE_START_DATE: ${{ vars.CTTC_LIVE_START_DATE }}

      - name: Commit sent marker
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f .cache/last-emailed-session.json ] && [ -n "$(git status --porcelain .cache/last-emailed-session.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .cache/last-emailed-session.json
            git commit -m "Record emailed session"
            git push
          fi
